steps:
  # Build Engine C Docker Image from root context
  - name: "gcr.io/cloud-builders/docker"
    id: "build-engine-c"
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest",
        "-f",
        "backend/engine-c/Dockerfile",
        ".",
      ]

  # Push to Artifact Registry (asia-south1)
  - name: "gcr.io/cloud-builders/docker"
    id: "push-engine-c"
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest",
      ]
    waitFor: ["build-engine-c"]

  # Deploy to Cloud Run in asia-south1
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-engine-c"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "engine-c",
        "--image",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest",
        "--set-env-vars",
        "ENGINE_A_URL=https://engine-a-r2f5flt77q-el.a.run.app,ENGINE_B_URL=https://engine-b-r2f5flt77q-el.a.run.app,GOOGLE_CLOUD_PROJECT=project-841b7f97-5ee3-4fbe-920",
        "--region",
        "asia-south1",
        "--memory",
        "512Mi",
        "--cpu",
        "1",
        "--allow-unauthenticated",
        "--service-account",
        "sa-engine-c@project-841b7f97-5ee3-4fbe-920.iam.gserviceaccount.com",
      ]
    waitFor: ["push-engine-c"]

images:
  - "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest"
