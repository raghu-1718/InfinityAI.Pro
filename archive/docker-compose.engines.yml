version: '3.8'

services:
  # Engine A: Data Ingestion & Preprocessing
  engine-a:
    build:
      context: ./backend/engine-core/src
      dockerfile: Dockerfile
    container_name: infinityai-engine-a-prod
    ports:
      - "8001:8080"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://infinityai-redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=infinityai-kafka:9092
      - API_KEYS_YAHOO_FINANCE=${YAHOO_FINANCE_API_KEY}
      - API_KEYS_ALPHA_VANTAGE=${ALPHA_VANTAGE_API_KEY}
      - ENABLE_CACHE=true
      - CACHE_TTL=300
      - LOG_LEVEL=INFO
    networks:
      - infinityai-network
    # External dependencies: infinityai-redis, infinityai-kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Engine B: AI/ML GPU Processing
  engine-b:
    build:
      context: ./backend/engine-analytics/src
      dockerfile: Dockerfile
    container_name: infinityai-engine-b-prod
    ports:
      - "8002:8080"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://infinityai-redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=infinityai-kafka:9092
      - MODEL_CACHE_DIR=/app/models
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
      - CUDA_VISIBLE_DEVICES=0
      - LOG_LEVEL=INFO
    volumes:
      - ai_models:/app/models
      - ai_cache:/app/cache
    networks:
      - infinityai-network
    # External dependencies: infinityai-redis, infinityai-kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Engine C: Orchestrator & Trading Engine
  engine-c:
    build:
      context: ./backend/engine-execution/src
      dockerfile: Dockerfile
    container_name: infinityai-engine-c-prod
    ports:
      - "8003:8080"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://infinityai-redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=infinityai-kafka:9092
      - KAFKA_ENABLED=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_BASE_URL=https://paper-api.alpaca.markets
      - ENGINE_A_URL=http://infinityai-engine-a-prod:8001
      - ENGINE_B_URL=http://infinityai-engine-b-prod:8002
      - LOG_LEVEL=INFO
    networks:
      - infinityai-network
    depends_on:
      - engine-a
      - engine-b
    # External dependencies: infinityai-postgres, infinityai-redis, infinityai-kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3



networks:
  infinityai-network:
    external: true

volumes:
  ai_models:
    driver: local
  ai_cache:
    driver: local