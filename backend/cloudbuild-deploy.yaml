steps:
  # --- ENGINE A ---
  - name: "gcr.io/cloud-builders/docker"
    id: "build-engine-a"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
        "-f",
        "backend/engine-a/Dockerfile",
        ".",
      ]
  - name: "gcr.io/cloud-builders/docker"
    id: "push-engine-a"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
      ]
    waitFor: ["build-engine-a"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-engine-a"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "engine-a",
        "--image",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
        "--set-env-vars",
        "ENGINE_B_URL=https://engine-b-r2f5flt77q-uc.a.run.app,ENGINE_C_URL=https://engine-c-r2f5flt77q-uc.a.run.app,GOOGLE_CLOUD_PROJECT=project-841b7f97-5ee3-4fbe-920",
        "--region",
        "us-central1",
      ]
    waitFor: ["push-engine-a"]

  # --- ENGINE B ---
  - name: "gcr.io/cloud-builders/docker"
    id: "build-engine-b"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-b:latest",
        "-f",
        "backend/engine-b/Dockerfile",
        ".",
      ]
    waitFor: ["-"] # Start Parallel
  - name: "gcr.io/cloud-builders/docker"
    id: "push-engine-b"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-b:latest",
      ]
    waitFor: ["build-engine-b"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-engine-b"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "engine-b",
        "--image",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-b:latest",
        "--set-env-vars",
        "ENGINE_A_URL=https://engine-a-r2f5flt77q-uc.a.run.app,ENGINE_C_URL=https://engine-c-r2f5flt77q-uc.a.run.app,GOOGLE_CLOUD_PROJECT=project-841b7f97-5ee3-4fbe-920",
        "--memory",
        "2Gi",
        "--cpu",
        "1",
        "--timeout",
        "300s",
        "--region",
        "us-central1",
      ]
    waitFor: ["push-engine-b"]

  # --- ENGINE C ---
  - name: "gcr.io/cloud-builders/docker"
    id: "build-engine-c"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest",
        "-f",
        "backend/engine-c/Dockerfile",
        ".",
      ]
    waitFor: ["-"] # Start Parallel
  - name: "gcr.io/cloud-builders/docker"
    id: "push-engine-c"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest",
      ]
    waitFor: ["build-engine-c"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-engine-c"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "engine-c",
        "--image",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest",
        "--set-env-vars",
        "ENGINE_A_URL=https://engine-a-r2f5flt77q-uc.a.run.app,ENGINE_B_URL=https://engine-b-r2f5flt77q-uc.a.run.app,GOOGLE_CLOUD_PROJECT=project-841b7f97-5ee3-4fbe-920",
        "--region",
        "us-central1",
      ]
    waitFor: ["push-engine-c"]

images:
  - "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/infinityai/engine-a:latest"
  - "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/infinityai/engine-b:latest"
  - "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/infinityai/engine-c:latest"
