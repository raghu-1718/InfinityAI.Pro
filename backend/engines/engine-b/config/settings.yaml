service:
  name: "InfinityAI Engine B"
  version: "4.0.0"
engine_a:
  base_url: "http://engine-a:8000" # override via ENV ENGINE_A_URL
markets:
  NSE_INDICES: ["NIFTY", "BANKNIFTY"]
  NSE_STOCKS: ["RELIANCE", "TCS", "INFY", "HDFCBANK", "ICICIBANK", "SBIN", "LT"]
  MCX_COMMODITIES: ["GOLD", "SILVER", "CRUDEOIL"]
india:
  timezone: "Asia/Kolkata"
  sessions:
    NSE: {open: "09:15", close: "15:30"}
    BSE: {open: "09:15", close: "15:30"}
    MCX: {open: "09:00", close: "23:30"}
  lot_sizes:
    NIFTY: 50
    BANKNIFTY: 15
  min_tick_value:
    NSE: 0.05
    MCX: 0.05
models:
  retrain_interval_hours: 24
  enable_transformers_sentiment: false
  ensemble:
    weights:
      rf_price: 0.35
      xgb_price: 0.30
      lgb_price: 0.25
      prophet_trend: 0.10
  risk:
    max_pos_risk: 0.02
    stop_atr_mult: 1.5
    target_rr: 1.8
feature_pipeline:
  lookback_bars: 200
  timeframe: "1d"