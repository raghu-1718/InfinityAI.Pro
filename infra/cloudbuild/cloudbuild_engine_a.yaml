steps:
  # Build Engine A Docker Image from root context
  - name: "gcr.io/cloud-builders/docker"
    id: "build-engine-a"
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
        "-f",
        "backend/engine-a/Dockerfile",
        ".",
      ]

  # Push to Artifact Registry (asia-south1)
  - name: "gcr.io/cloud-builders/docker"
    id: "push-engine-a"
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
      ]
    waitFor: ["build-engine-a"]

  # Deploy to Cloud Run in asia-south1
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-engine-a"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "engine-a",
        "--image",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
        "--set-env-vars",
        "ENGINE_B_URL=https://engine-b-313407263327.asia-south1.run.app,ENGINE_C_URL=https://engine-c-313407263327.asia-south1.run.app,GOOGLE_CLOUD_PROJECT=project-841b7f97-5ee3-4fbe-920,ENVIRONMENT=production,PRIMARY_USER_ID=raghu_primary,SIMULATION_CAPITAL=30000.0,INTERNAL_TOKEN=1X13e7abPj9k9kf06Lv6abyda8rchXW5l5YwKj03cUU,INTERNAL_AUTH_TOKEN=1X13e7abPj9k9kf06Lv6abyda8rchXW5l5YwKj03cUU",
        "--set-secrets",
        "TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest",
        "--region",
        "asia-south1",
        "--platform",
        "managed",
        "--network",
        "default",
        "--subnet",
        "default",
        "--vpc-egress",
        "private-ranges-only",
        "--allow-unauthenticated",
        "--port",
        "8080",
        "--timeout",
        "600s",
        "--memory",
        "2Gi",
        "--service-account",
        "sa-engine-a@project-841b7f97-5ee3-4fbe-920.iam.gserviceaccount.com",
      ]
    waitFor: ["push-engine-a"]

images:
  - "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest"
timeout: "1200s"
