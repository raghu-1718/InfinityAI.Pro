# Cloud Build Configuration for ML Training Pipeline
# Automates: Docker build → Train model → Upload to GCS

steps:
  # Step 1: Build Docker image (explicit Dockerfile path + context)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ml/xgb-trainer:latest'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ml/xgb-trainer:$BUILD_ID'
      - '-f'
      - 'ml/Dockerfile'
      - 'ml'
  
  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ml/xgb-trainer:latest'
  
  # Step 3: Run training container
  - name: 'asia-south1-docker.pkg.dev/$PROJECT_ID/ml/xgb-trainer:latest'
    args:
      - '--dataset=gs://${PROJECT_ID}-ml-models/data/ohlcv_latest.csv'
      - '--model_uri=gs://${PROJECT_ID}-ml-models/xgb/model_$BUILD_ID.json'
    env:
      - 'PYTHONUNBUFFERED=1'

   # Step 4: Automated E2E/Smoke Test Steps
   - name: 'python:3.10-slim'
     id: 'smoke-check-firestore-collections'
     entrypoint: 'python'
     args: ['tools/smoke_tests/check_collections.py']
     env:
       - 'GOOGLE_APPLICATION_CREDENTIALS=/workspace/sa-key.json'
   - name: 'python:3.10-slim'
     id: 'smoke-compare-nifty'
     entrypoint: 'python'
     args: ['tools/smoke_tests/compare_nifty.py']
     env:
       - 'GOOGLE_APPLICATION_CREDENTIALS=/workspace/sa-key.json'

# Push images to registry
images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ml/xgb-trainer:latest'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/ml/xgb-trainer:$BUILD_ID'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'  # 8 vCPU for faster training
  logging: CLOUD_LOGGING_ONLY

# Timeout
timeout: 1800s  # 30 minutes max
