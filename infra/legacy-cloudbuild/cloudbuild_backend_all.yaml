steps:
  # ===================================================================
  # 1. BUILD ENGINE A
  # ===================================================================
  - name: "gcr.io/cloud-builders/docker"
    id: "build-engine-a"
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
        "-f",
        "backend/engine-a/Dockerfile",
        ".",
      ]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-engine-a"
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
      ]
    waitFor: ["build-engine-a"]

  # ===================================================================
  # 2. BUILD ENGINE C
  # ===================================================================
  - name: "gcr.io/cloud-builders/docker"
    id: "build-engine-c"
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest",
        "-f",
        "backend/engine-c/Dockerfile",
        ".",
      ]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-engine-c"
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest",
      ]
    waitFor: ["build-engine-c"]

  # ===================================================================
  # 3. DEPLOY ENGINE A (Cloud Run asia-south1)
  # ===================================================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-engine-a"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "engine-a",
        "--image",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
        "--set-env-vars",
        "ENGINE_B_URL=https://engine-b-r2f5flt77q-el.a.run.app,ENGINE_C_URL=https://engine-c-r2f5flt77q-el.a.run.app,GOOGLE_CLOUD_PROJECT=project-841b7f97-5ee3-4fbe-920,ENVIRONMENT=production,PRIMARY_USER_ID=raghu_primary",
        "--set-secrets",
        "TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=TELEGRAM_CHAT_ID:latest",
        "--region",
        "asia-south1",
        "--platform",
        "managed",
        "--network",
        "default",
        "--subnet",
        "default",
        "--vpc-egress",
        "private-ranges-only",
        "--allow-unauthenticated",
        "--port",
        "8080",
        "--timeout",
        "600s",
        "--memory",
        "1Gi",
        "--service-account",
        "sa-engine-a@project-841b7f97-5ee3-4fbe-920.iam.gserviceaccount.com",
      ]
    waitFor: ["push-engine-a"]

  # ===================================================================
  # 4. DEPLOY ENGINE C (Cloud Run asia-south1)
  # ===================================================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-engine-c"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "engine-c",
        "--image",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest",
        "--set-env-vars",
        "ENGINE_A_URL=https://engine-a-r2f5flt77q-el.a.run.app,ENGINE_B_URL=https://engine-b-r2f5flt77q-el.a.run.app,GOOGLE_CLOUD_PROJECT=project-841b7f97-5ee3-4fbe-920",
        "--region",
        "asia-south1",
        "--memory",
        "512Mi",
        "--cpu",
        "1",
        "--allow-unauthenticated",
        "--service-account",
        "sa-engine-c@project-841b7f97-5ee3-4fbe-920.iam.gserviceaccount.com",
      ]
    waitFor: ["push-engine-c"]

images:
  - "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest"
  - "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-c:latest"
timeout: "1800s"
