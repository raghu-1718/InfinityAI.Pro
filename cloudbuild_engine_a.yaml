steps:
  # Build Engine A Docker Image from root context
  - name: "gcr.io/cloud-builders/docker"
    id: "build-engine-a"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
        "-f",
        "backend/engine-a/Dockerfile",
        ".",
      ]

  # Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-engine-a"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
      ]
    waitFor: ["build-engine-a"]

  # Deploy to Cloud Run in asia-south1
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-engine-a"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "engine-a",
        "--image",
        "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest",
        "--set-env-vars",
        "ENGINE_B_URL=http://engine-b-ml-prod.asia-south1-a.c.project-841b7f97-5ee3-4fbe-920.internal:8080,ENGINE_C_URL=https://engine-c-313407263327.asia-south1.run.app,GOOGLE_CLOUD_PROJECT=project-841b7f97-5ee3-4fbe-920,ENVIRONMENT=production,PRIMARY_USER_ID=raghu_primary",
        "--region",
        "asia-south1",
        "--platform",
        "managed",
        "--network",
        "default",
        "--subnet",
        "default",
        "--vpc-egress",
        "all-traffic",
        "--allow-unauthenticated",
        "--memory",
        "1Gi",
      ]
    waitFor: ["push-engine-a"]

images:
  - "us-central1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-a:latest"
timeout: "1200s"
