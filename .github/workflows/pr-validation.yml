# InfinityAI.Pro - Pull Request CI Pipeline
# Runs tests and builds to validate changes before merge
# Last updated: 2025-12-08

name: 🔍 PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "frontend/web-app/**"
      - "frontend/functions/**"

env:
  NODE_VERSION: "20"

jobs:
  # ============================================
  # Validate Frontend (Next.js)
  # ============================================
  validate-frontend:
    name: 🌐 Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Type Check
        working-directory: frontend/web-app
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend/web-app
        run: npm run lint || true

      - name: Build
        working-directory: frontend/web-app
        run: npm run build
        env:
          NEXT_PUBLIC_ENGINE_A_URL: https://engine-a-429140669077.us-central1.run.app
          NEXT_PUBLIC_ENGINE_B_URL: https://engine-b-429140669077.us-central1.run.app
          NEXT_PUBLIC_ENGINE_C_URL: https://engine-c-429140669077.us-central1.run.app
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAnEUI1GqUnAL8h3GFQMmnpBXv7nh6tu3k
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: gen-lang-client-0779271931.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: gen-lang-client-0779271931
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: gen-lang-client-0779271931.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 429140669077
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:429140669077:web:e071ad7a136c74a3ea219c

  # ============================================
  # Validate Firebase Functions (Gemini/Vertex AI)
  # ============================================
  validate-functions:
    name: ⚡ Validate Firebase Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/functions/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/functions
        run: npm ci

      - name: Type Check
        working-directory: frontend/functions
        run: npx tsc --noEmit || true

      - name: Build Functions
        working-directory: frontend/functions
        run: npm run build || npx tsc

  # ============================================
  # Validate Backend - Engine A (Orchestration)
  # ============================================
  validate-engine-a:
    name: 🅰️ Validate Engine A
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: backend/engine-a
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        working-directory: backend/engine-a
        run: |
          pip install ruff
          ruff check src/ || true

      - name: Type Check with MyPy
        working-directory: backend/engine-a
        run: |
          pip install mypy
          mypy src/main.py --ignore-missing-imports || true

      - name: Build Docker Image
        working-directory: backend/engine-a
        run: docker build -t engine-a-test .

  # ============================================
  # Validate Backend - Engine B (AI/ML/Gemini)
  # ============================================
  validate-engine-b:
    name: 🅱️ Validate Engine B
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: backend/engine-b
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        working-directory: backend/engine-b
        run: |
          pip install ruff
          ruff check src/ || true

      - name: Build Docker Image
        working-directory: backend/engine-b
        run: docker build -t engine-b-test .

  # ============================================
  # Validate Backend - Engine C (Execution)
  # ============================================
  validate-engine-c:
    name: 🇨 Validate Engine C
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: backend/engine-c
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        working-directory: backend/engine-c
        run: |
          pip install ruff
          ruff check src/ || true

      - name: Build Docker Image
        working-directory: backend/engine-c
        run: docker build -t engine-c-test .
