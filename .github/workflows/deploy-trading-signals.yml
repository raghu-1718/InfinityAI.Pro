name: Deploy Trading Signals Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/trading-signals/**"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: galvanic-pulsar-482815-h0
  GCP_REGION: us-central1
  PYTHON_VERSION: "3.12"

jobs:
  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy detect-momentum-signals
        run: |
          gcloud functions deploy detect-momentum-signals \
            --gen2 \
            --runtime=python${{ env.PYTHON_VERSION }} \
            --region=${{ env.GCP_REGION }} \
            --source=functions/trading-signals \
            --entry-point=detect_momentum_signals \
            --trigger-http \
            --allow-unauthenticated \
            --max-instances=3 \
            --memory=512MB \
            --timeout=300s

      - name: Deploy get-latest-signals
        run: |
          gcloud functions deploy get-latest-signals \
            --gen2 \
            --runtime=python${{ env.PYTHON_VERSION }} \
            --region=${{ env.GCP_REGION }} \
            --source=functions/trading-signals \
            --entry-point=get_latest_signals \
            --trigger-http \
            --allow-unauthenticated \
            --max-instances=6 \
            --memory=256MB \
            --timeout=60s

      - name: Verify deployments
        run: |
          echo "✅ Functions deployed successfully"
          gcloud functions describe detect-momentum-signals --region=${{ env.GCP_REGION }} --gen2
          gcloud functions describe get-latest-signals --region=${{ env.GCP_REGION }} --gen2
