name: Monorepo CI - Frontend & Engines (A/B/C/D)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infinityai-pro/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infinityai-pro/frontend/package-lock.json
      - name: Install deps
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Smoke test build output
        run: test -f build/index.html

  engine-a:
    name: Engine A (Market Data) Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        working-directory: infinityai-pro/backend/engines/engine-a
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint import
        working-directory: infinityai-pro/backend/engines/engine-a
        run: python -c "import main; print('Engine A import OK')"

  engine-b:
    name: Engine B (AI Insights) Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps (light)
        working-directory: infinityai-pro/backend/engines/engine-b
        run: |
          if [ -f requirements.txt ]; then sed -e 's/torch==.*//g' requirements.txt > req-lite.txt || true; fi
          if [ -f req-lite.txt ]; then pip install -r req-lite.txt; fi
      - name: Import smoke test
        working-directory: infinityai-pro/backend/engines/engine-b
        run: python -c "import main; print('Engine B import OK')"

  engine-c:
    name: Engine C (Trading) Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        working-directory: infinityai-pro/backend/engines/engine-c
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Import smoke test
        working-directory: infinityai-pro/backend/engines/engine-c
        run: python -c "import main; print('Engine C import OK')"

  engine-d:
    name: Engine D (Aggregator) Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        working-directory: infinityai-pro/backend/engines/engine-d
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Import smoke test
        working-directory: infinityai-pro/backend/engines/engine-d
        env:
          ENABLE_TRANSFORMERS: 'false'
        run: python -c "import main; print('Engine D import OK')"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend, engine-a, engine-b, engine-c, engine-d]
    steps:
      - name: Report
        run: echo "All build/import smoke tests completed." 