name: Deploy InfinityAI.Pro to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    name: Deploy & Verify Production Environment
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Debug GCP Authentication and Setup
        run: |
          echo "---- gcloud auth list ----"
          gcloud auth list
          echo "---- active account ----"
          gcloud config list --format='value(core.account)'
          echo "---- project config ----"
          gcloud config list project
          echo "---- checking artifact registry repository ----"
          gcloud artifacts repositories describe cloud-run-source-deploy --location=us-central1 --project=infinitygt-b2287 || echo "Repository does not exist, will create it"

      - name: Create Artifact Registry Repository if needed
        run: |
          # Create the repository if it doesn't exist
          gcloud artifacts repositories create cloud-run-source-deploy \
            --repository-format=docker \
            --location=us-central1 \
            --description="Repository used by Cloud Run source deploy" \
            --project=infinitygt-b2287 || echo "Repository may already exist"

          # Grant necessary permissions
          gcloud artifacts repositories add-iam-policy-binding cloud-run-source-deploy \
            --location=us-central1 \
            --member="serviceAccount:github-actions-deployer@infinitygt-b2287.iam.gserviceaccount.com" \
            --role="roles/artifactregistry.reader" \
            --project=infinitygt-b2287 || true

          # Grant Cloud Build service account writer access
          PROJECT_NUMBER=$(gcloud projects describe infinitygt-b2287 --format='value(projectNumber)')
          gcloud artifacts repositories add-iam-policy-binding cloud-run-source-deploy \
            --location=us-central1 \
            --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
            --role="roles/artifactregistry.writer" \
            --project=infinitygt-b2287 || true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Engine A (Market Data) with retry
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..5}; do
            if gcloud run deploy infinityai-engine-a \
              --source ./engines/engine-a \
              --region us-central1 \
              --project infinitygt-b2287 \
              --allow-unauthenticated \
              --set-secrets="DHAN_API_KEY=dhan-api-key:latest"; then
              echo "Deploy engine-a succeeded on attempt $i"; break;
            else
              echo "Deploy engine-a failed (attempt $i). Backing off..."; sleep $((2**i));
            fi
          done

      - name: Deploy Engine B (AI/ML) with retry
        shell: bash
        run: |
          set -euo pipefail
          # Best-effort clear env vars
          gcloud run services update infinityai-engine-b --clear-env-vars --region=us-central1 --project=infinitygt-b2287 || true
          for i in {1..5}; do
            if gcloud run deploy infinityai-engine-b \
              --source ./engines/engine-b \
              --region us-central1 \
              --project infinitygt-b2287 \
              --allow-unauthenticated \
              --set-secrets="GEMINI_API_KEY_PRIMARY=gemini-api-key-primary:latest,GEMINI_API_KEY_SECONDARY=gemini-api-key-secondary:latest"; then
              echo "Deploy engine-b succeeded on attempt $i"; break;
            else
              echo "Deploy engine-b failed (attempt $i). Backing off..."; sleep $((2**i));
            fi
          done

      - name: Deploy Engine C (Trade Execution) with retry
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..5}; do
            if gcloud run deploy infinityai-engine-c-execution \
              --source ./engines/engine-c-execution \
              --region us-central1 \
              --project infinitygt-b2287 \
              --no-allow-unauthenticated; then
              echo "Deploy engine-c-execution succeeded on attempt $i"; break;
            else
              echo "Deploy engine-c-execution failed (attempt $i). Backing off..."; sleep $((2**i));
            fi
          done

      - name: Deploy Engine D (Orchestrator) with retry
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..5}; do
            if gcloud run deploy infinityai-engine-d \
              --source ./engines/engine-d \
              --region us-central1 \
              --project infinitygt-b2287 \
              --allow-unauthenticated; then
              echo "Deploy engine-d succeeded on attempt $i"; break;
            else
              echo "Deploy engine-d failed (attempt $i). Backing off..."; sleep $((2**i));
            fi
          done

      - name: Set up Google Cloud credentials for Firebase
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > ${{ github.workspace }}/gcp-sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="${{ github.workspace }}/gcp-sa-key.json"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project infinitygt-b2287

      - name: Validate credentials file
        run: |
          echo "Checking credentials file format..."
          python -m json.tool ${{ github.workspace }}/gcp-sa-key.json > /dev/null && echo "✅ JSON is valid" || echo "❌ JSON is invalid"
          ls -la ${{ github.workspace }}/gcp-sa-key.json

      - name: Clean up orphaned Firebase Functions
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="${{ github.workspace }}/gcp-sa-key.json"
          firebase functions:delete submitDhanCredentials --region us-central1 --force --project infinitygt-b2287 || echo "Function may not exist or already deleted"

      - name: Deploy Firebase Functions
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="${{ github.workspace }}/gcp-sa-key.json"
          cd functions
          npm install
          cd ..
          firebase deploy --only functions --project infinitygt-b2287 --non-interactive

      - name: Clean up credentials file
        run: rm -f ${{ github.workspace }}/gcp-sa-key.json

      - name: Deploy Frontend with retry
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..5}; do
            if gcloud run deploy infinityai-frontend \
              --source ./frontend \
              --region us-central1 \
              --project infinitygt-b2287 \
              --allow-unauthenticated; then
              echo "Deploy frontend succeeded on attempt $i"; break;
            else
              echo "Deploy frontend failed (attempt $i). Backing off..."; sleep $((2**i));
            fi
          done

      - name: Wait for services to stabilize
        run: sleep 60

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies for verification
        run: |
          python -m pip install --upgrade pip
          pip install requests asyncio websocket-client

      - name: Run Post-Deployment Verification
        id: verification
        run: |
          python infinityai_system_verifier.py
        continue-on-error: true

      - name: Check Verification Status
        if: steps.verification.outcome != 'success'
        run: |
          echo "🔴 End-to-end verification failed after deployment."
          exit 1

      - name: Final Summary
        run: |
          echo "✅ All services deployed and verified successfully."
          echo "Production environment is live and healthy."

