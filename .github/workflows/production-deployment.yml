
# This single, consolidated workflow handles the entire production deployment.
# It is structured as a single job to work around a suspected restrictive Workload Identity Provider policy.
# Retrying after granting Firebase Admin to the service account.

name: Deploy Production Environment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering of the workflow

env:
  GCP_PROJECT_ID: after-yesterday-473512-k3
  GCP_REGION: us-central1
  REPO_NAME: infinityai

jobs:
  # The entire process is in a single job with this *exact* ID, as it is suspected
  # that the WIF provider is scoped to only allow this job ID to authenticate.
  build_and_push_images:
    name: Build and Deploy All Services
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet --project=${{ env.GCP_PROJECT_ID }}

      # === DEPLOY ENGINE-CORE ===
      - name: Build and Push engine-core
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/engine-core:latest"
          docker build -t $IMAGE_URI backend/engine-core
          docker push $IMAGE_URI
      - name: Deploy engine-core
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/engine-core:latest"
          gcloud run deploy infinityai-engine-a \
            --image=$IMAGE_URI \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-secrets=DHAN_API_KEY=dhan-api-key:latest

      # === DEPLOY ENGINE-ANALYTICS ===
      - name: Build and Push engine-analytics
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/engine-analytics:latest"
          docker build -t $IMAGE_URI backend/engine-analytics
          docker push $IMAGE_URI
      - name: Deploy engine-analytics
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/engine-analytics:latest"
          gcloud run deploy infinityai-engine-b \
            --image=$IMAGE_URI \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-secrets=GEMINI_API_KEY_PRIMARY=gemini-api-key-primary:latest,GEMINI_API_KEY_SECONDARY=gemini-api-key-secondary:latest

      # === DEPLOY ENGINE-EXECUTION ===
      - name: Build and Push engine-execution
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/engine-execution:latest"
          docker build -t $IMAGE_URI backend/engine-execution
          docker push $IMAGE_URI
      - name: Deploy engine-execution
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/engine-execution:latest"
          gcloud run deploy infinityai-engine-c-execution \
            --image=$IMAGE_URI \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated

      # === DEPLOY FRONTEND AND FIREBASE ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build --workspace=frontend
          npm run build --workspace=functions

      - name: Deploy to Firebase Hosting and Functions
        run: firebase deploy --project=infinity-ai-5ec7c --non-interactive --force
