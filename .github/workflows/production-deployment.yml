
# This is a simplified workflow to build and push Docker images to the Artifact Registry.
# It is designed to be as simple as possible to isolate and resolve the authentication and permission issues.
# This comment is to trigger a new run of the workflow after correcting the IAM permissions.

name: Build and Push Backend Images

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering of the workflow

env:
  GCP_PROJECT_ID: after-yesterday-473512-k3
  GCP_REGION: us-central1
  REPO_NAME: infinityai # A short name for the repository, used for image naming

jobs:
  build_and_push_images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    strategy:
      matrix:
        # Define all services that need to be containerized
        service: ['engine-core', 'engine-analytics', 'engine-execution']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet --project=${{ env.GCP_PROJECT_ID }}

      - name: Build and Push Docker Image
        run: |
          SOURCE_DIR="backend/${{ matrix.service }}"
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ matrix.service }}:latest"
          
          echo "Building image for ${{ matrix.service }} from $SOURCE_DIR"
          echo "Image URI: $IMAGE_URI"
          
          docker build -t $IMAGE_URI $SOURCE_DIR
          docker push $IMAGE_URI
