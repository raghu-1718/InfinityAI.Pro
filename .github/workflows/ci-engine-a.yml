name: Engine A CI

on:
  push:
    branches: [ main ]
    paths:
      - 'infinityai-pro/backend/engines/engine-a/**'
      - '.github/workflows/ci-engine-a.yml'
  pull_request:
    paths:
      - 'infinityai-pro/backend/engines/engine-a/**'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
            python-version: '3.11'
      - name: Install minimal deps
        working-directory: infinityai-pro/backend/engines/engine-a
        run: |
          if [ -f requirements.txt ]; then grep -E '^(fastapi|uvicorn|pydantic|httpx|redis|numpy|pandas)' requirements.txt > req.txt || true; fi
          if [ -f req.txt ]; then pip install -r req.txt; fi
      - name: Import smoke
        working-directory: infinityai-pro/backend/engines/engine-a
        run: python -c "import sys;\ntry:\n import main; print('Engine A import OK')\nexcept Exception as e:\n print('Engine A import failed:', e); sys.exit(1)"
