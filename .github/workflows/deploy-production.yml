# InfinityAI.Pro - Complete CI/CD Pipeline
# Deploys all 3 backend engines to Cloud Run and frontend to Firebase Hosting
# Triggers on EVERY push to main branch (builds fresh images)
# Last updated: 2025-12-02

name: 🚀 Deploy InfinityAI Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Force deploy all services'
        required: false
        default: false
        type: boolean
      deploy_engine_a:
        description: 'Deploy Engine A'
        required: false
        default: false
        type: boolean
      deploy_engine_b:
        description: 'Deploy Engine B'
        required: false
        default: false
        type: boolean
      deploy_engine_c:
        description: 'Deploy Engine C'
        required: false
        default: false
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend'
        required: false
        default: false
        type: boolean

env:
  GCP_PROJECT_ID: after-yesterday-473512-k3
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/after-yesterday-473512-k3/infinityai

jobs:
  # ============================================
  # Detect Changes (using correct directory names)
  # ============================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      engine-a: ${{ steps.filter.outputs.engine-a }}
      engine-b: ${{ steps.filter.outputs.engine-b }}
      engine-c: ${{ steps.filter.outputs.engine-c }}
      shared: ${{ steps.filter.outputs.shared }}
      frontend: ${{ steps.filter.outputs.frontend }}
      any-backend: ${{ steps.filter.outputs.engine-a == 'true' || steps.filter.outputs.engine-b == 'true' || steps.filter.outputs.engine-c == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine-a:
              - 'backend/engine-a/**'
            engine-b:
              - 'backend/engine-b/**'
            engine-c:
              - 'backend/engine-c/**'
            shared:
              - 'backend/shared/**'
            frontend:
              - 'frontend/web-app/**'
              - 'firebase.json'

  # ============================================
  # Deploy Engine A (Orchestrator/Risk)
  # ============================================
  deploy-engine-a:
    name: 🅰️ Deploy Engine A
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.engine-a == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      github.event.inputs.deploy_all == 'true' ||
      github.event.inputs.deploy_engine_a == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/engine-a:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/engine-a:latest"

          echo "🔨 Building Engine A..."
          docker build -t $IMAGE -t $IMAGE_LATEST backend/engine-a

          echo "📤 Pushing to Artifact Registry..."
          docker push $IMAGE
          docker push $IMAGE_LATEST

          echo "✅ Image pushed: $IMAGE"

      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying Engine A to Cloud Run..."
          gcloud run deploy engine-a \
            --image=${{ env.ARTIFACT_REGISTRY }}/engine-a:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=5 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},ENGINE_B_URL=https://engine-b-573866363639.us-central1.run.app,ENGINE_C_URL=https://engine-c-573866363639.us-central1.run.app" \
            --set-secrets="DHAN_CLIENT_ID=dhan-client-id:latest,DHAN_API_SECRET=dhan-api-secret:latest,DHAN_ACCESS_TOKEN=dhan-access-token:latest"

      - name: Health Check
        run: |
          echo "⏳ Waiting for deployment to stabilize..."
          sleep 30
          echo "🔍 Running health check..."
          if curl -sf https://engine-a-573866363639.us-central1.run.app/health; then
            echo "✅ Engine A is healthy!"
          else
            echo "⚠️ Health check failed - service may still be starting"
          fi

  # ============================================
  # Deploy Engine B (AI/ML Intelligence)
  # ============================================
  deploy-engine-b:
    name: 🅱️ Deploy Engine B
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.engine-b == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      github.event.inputs.deploy_all == 'true' ||
      github.event.inputs.deploy_engine_b == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/engine-b:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/engine-b:latest"

          echo "🔨 Building Engine B (AI/ML - this may take a few minutes)..."
          docker build -t $IMAGE -t $IMAGE_LATEST backend/engine-b

          echo "📤 Pushing to Artifact Registry..."
          docker push $IMAGE
          docker push $IMAGE_LATEST

          echo "✅ Image pushed: $IMAGE"

      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying Engine B to Cloud Run..."
          gcloud run deploy engine-b \
            --image=${{ env.ARTIFACT_REGISTRY }}/engine-b:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=4Gi \
            --cpu=2 \
            --timeout=600 \
            --concurrency=50 \
            --min-instances=0 \
            --max-instances=10 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},ENGINE_A_URL=https://engine-a-573866363639.us-central1.run.app,ENGINE_C_URL=https://engine-c-573866363639.us-central1.run.app" \
            --set-secrets="DHAN_CLIENT_ID=dhan-client-id:latest,DHAN_API_SECRET=dhan-api-secret:latest,DHAN_ACCESS_TOKEN=dhan-access-token:latest,GEMINI_API_KEY=gemini-api-key:latest"

      - name: Health Check
        run: |
          echo "⏳ Waiting for deployment to stabilize (Engine B is larger)..."
          sleep 45
          echo "🔍 Running health check..."
          if curl -sf https://engine-b-573866363639.us-central1.run.app/health; then
            echo "✅ Engine B is healthy!"
          else
            echo "⚠️ Health check failed - service may still be starting"
          fi

  # ============================================
  # Deploy Engine C (Execution)
  # ============================================
  deploy-engine-c:
    name: 🇨 Deploy Engine C
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.engine-c == 'true' ||
      needs.detect-changes.outputs.shared == 'true' ||
      github.event.inputs.deploy_all == 'true' ||
      github.event.inputs.deploy_engine_c == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/engine-c:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/engine-c:latest"

          echo "🔨 Building Engine C..."
          docker build -t $IMAGE -t $IMAGE_LATEST backend/engine-c

          echo "📤 Pushing to Artifact Registry..."
          docker push $IMAGE
          docker push $IMAGE_LATEST

          echo "✅ Image pushed: $IMAGE"

      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying Engine C to Cloud Run..."
          gcloud run deploy engine-c \
            --image=${{ env.ARTIFACT_REGISTRY }}/engine-c:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=5 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},ENGINE_A_URL=https://engine-a-573866363639.us-central1.run.app,ENGINE_B_URL=https://engine-b-573866363639.us-central1.run.app" \
            --set-secrets="DHAN_CLIENT_ID=dhan-client-id:latest,DHAN_API_SECRET=dhan-api-secret:latest,DHAN_ACCESS_TOKEN=dhan-access-token:latest,ENCRYPTION_KEY=encryption-key:latest"

      - name: Health Check
        run: |
          echo "⏳ Waiting for deployment to stabilize..."
          sleep 30
          echo "🔍 Running health check..."
          if curl -sf https://engine-c-573866363639.us-central1.run.app/health; then
            echo "✅ Engine C is healthy!"
          else
            echo "⚠️ Health check failed - service may still be starting"
          fi

  # ============================================
  # Deploy Frontend to Firebase Hosting
  # ============================================
  deploy-frontend:
    name: 🌐 Deploy Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.frontend == 'true' ||
      github.event.inputs.deploy_all == 'true' ||
      github.event.inputs.deploy_frontend == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Build Next.js App
        working-directory: frontend/web-app
        run: npm run build
        env:
          NEXT_PUBLIC_ENGINE_A_URL: https://engine-a-573866363639.us-central1.run.app
          NEXT_PUBLIC_ENGINE_B_URL: https://engine-b-573866363639.us-central1.run.app
          NEXT_PUBLIC_ENGINE_C_URL: https://engine-c-573866363639.us-central1.run.app
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: after-yesterday-473512-k3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.GCP_PROJECT_ID }}
          channelId: live

  # ============================================
  # Post-Deployment Verification
  # ============================================
  verify-deployment:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-engine-a, deploy-engine-b, deploy-engine-c, deploy-frontend]
    if: always() && (needs.deploy-engine-a.result == 'success' || needs.deploy-engine-b.result == 'success' || needs.deploy-engine-c.result == 'success' || needs.deploy-frontend.result == 'success')

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check Engine A Health
        if: needs.deploy-engine-a.result == 'success'
        run: |
          echo "🔍 Checking Engine A..."
          response=$(curl -sf https://engine-a-573866363639.us-central1.run.app/health)
          echo "$response" | jq '.'
          echo "✅ Engine A verified!"

      - name: Check Engine B Health
        if: needs.deploy-engine-b.result == 'success'
        run: |
          echo "🔍 Checking Engine B..."
          response=$(curl -sf https://engine-b-573866363639.us-central1.run.app/health)
          echo "$response" | jq '.'
          echo "✅ Engine B verified!"

      - name: Check Engine C Health
        if: needs.deploy-engine-c.result == 'success'
        run: |
          echo "🔍 Checking Engine C..."
          response=$(curl -sf https://engine-c-573866363639.us-central1.run.app/health)
          echo "$response" | jq '.'
          echo "✅ Engine C verified!"

      - name: Check Security Headers
        run: |
          echo "🔒 Checking Security Headers..."
          for engine in engine-a engine-b engine-c; do
            echo "--- $engine ---"
            headers=$(curl -sI "https://${engine}-573866363639.us-central1.run.app/health")
            echo "$headers" | grep -i "strict-transport\|x-frame\|x-content-type" || echo "Headers check done"
          done

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "🎉 DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          echo "📦 Services:"
          echo "  Engine A: https://engine-a-573866363639.us-central1.run.app"
          echo "  Engine B: https://engine-b-573866363639.us-central1.run.app"
          echo "  Engine C: https://engine-c-573866363639.us-central1.run.app"
          echo "  Frontend: https://after-yesterday-473512-k3.web.app"
          echo ""
          echo "📊 API Docs:"
          echo "  Engine A: https://engine-a-573866363639.us-central1.run.app/docs"
          echo "  Engine B: https://engine-b-573866363639.us-central1.run.app/docs"
          echo "  Engine C: https://engine-c-573866363639.us-central1.run.app/docs"
          echo "=========================================="

  # ============================================
  # Notify on Failure
  # ============================================
  notify-failure:
    name: 🚨 Notify on Failure
    runs-on: ubuntu-latest
    needs: [deploy-engine-a, deploy-engine-b, deploy-engine-c, deploy-frontend]
    if: failure()
    steps:
      - name: Create Failure Summary
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Engine A | ${{ needs.deploy-engine-a.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Engine B | ${{ needs.deploy-engine-b.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Engine C | ${{ needs.deploy-engine-c.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
