name: Deploy Production Stack (AWS + GCP)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag for all engine containers (e.g., latest, git sha)'
        required: true
        default: 'latest'

permissions:
  contents: read
  id-token: write # Required for GCP and AWS OIDC authentication

jobs:
  #########################################
  # DEPLOY ENGINES A & B to GCP CLOUD RUN
  #########################################
  deploy-gcp-engines:
    name: Deploy Engines A & B to GCP
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [engine-a-market-data, engine-b-ai-ml]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Build and Push to Google Artifact Registry
        run: |-
          gcloud builds submit 'engines/${{ matrix.engine }}' \
            --tag '${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/infinityai-repo/infinityai-${{ matrix.engine }}:${{ github.event.inputs.image_tag }}'

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy 'infinityai-${{ matrix.engine }}' \
            --image '${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/infinityai-repo/infinityai-${{ matrix.engine }}:${{ github.event.inputs.image_tag }}' \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated

  #########################################
  # DEPLOY ENGINES C & D to AWS ECS
  #########################################
  deploy-aws-engines:
    name: Deploy Engines C & D to AWS ECS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [engine-c-execution, engine-d-chatbot]
        include:
          - engine: engine-c-execution
            container_name: engine-c-execution
            task_family: infinityai-engine-c
            service_name_secret: ECS_SERVICE_NAME_C
          - engine: engine-d-chatbot
            container_name: engine-d-chatbot
            task_family: infinityai-engine-d
            service_name_secret: ECS_SERVICE_NAME_D
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: infinityai-${{ matrix.engine }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f engines/${{ matrix.engine }}/Dockerfile engines/${{ matrix.engine }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ matrix.task_family }} --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets[matrix.service_name_secret] }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

  #########################################
  # DEPLOY FRONTEND TO AWS S3/CLOUDFRONT
  #########################################
  deploy-frontend-aws:
    name: Deploy Frontend to AWS S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Build Frontend
        working-directory: frontend/web-app
        run: |
          npm ci
          npm run build

      - name: Deploy to S3
        working-directory: frontend/web-app
        run: |
          aws s3 sync build/ s3://${{ secrets.AWS_S3_BUCKET_FRONTEND }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  #########################################
  # SUMMARY
  #########################################
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-gcp-engines, deploy-aws-engines, deploy-frontend-aws]
    steps:
      - name: Report Success
        run: |
          echo "✅✅✅"
          echo "All components deployed successfully to AWS and GCP!"
          echo "Application URL: https://infinityai.pro"

