# InfinityAI.Pro - 100% GCP & Firebase CI/CD Pipeline
# Deploys FastAPI engines (A, B, C) to GCP Cloud Run via Google Workload Identity Federation (WIF)
# Deploys frontend to Firebase Hosting

name: 🚀 Deploy InfinityAI GCP Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: "project-841b7f97-5ee3-4fbe-920"
  GCP_REGION: "asia-south1"
  WIF_PROVIDER: "projects/313407263327/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  SERVICE_ACCOUNT: "github-actions-deployer@project-841b7f97-5ee3-4fbe-920.iam.gserviceaccount.com"

jobs:
  # ============================================
  # 1. Google Cloud Authentication via WIF
  # ============================================
  deploy-backend-cloud-run:
    name: ☁️ GCP Cloud Run Engines Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker to push to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # Deploy Engine A
      - name: Build & Deploy Engine A
        run: |
          gcloud builds submit --config=cloudbuild_engine_a.yaml --project=${{ env.GCP_PROJECT_ID }} .

      # Deploy Engine C
      - name: Build & Deploy Engine C
        run: |
          gcloud builds submit --config=cloudbuild.engine-c.yaml --project=${{ env.GCP_PROJECT_ID }} .

  # ============================================
  # 2. Deploy Frontend to Firebase Hosting
  # ============================================
  deploy-frontend-firebase:
    name: 🔥 Firebase Hosting Deployment
    runs-on: ubuntu-latest
    needs: deploy-backend-cloud-run
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Build Next.js Web Application
        working-directory: frontend/web-app
        run: npm run build
        env:
          NEXT_PUBLIC_ENGINE_A_URL: https://engine-a-313407263327.asia-south1.run.app
          NEXT_PUBLIC_ENGINE_B_URL: https://engine-a-313407263327.asia-south1.run.app
          NEXT_PUBLIC_ENGINE_C_URL: https://engine-c-313407263327.asia-south1.run.app

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_841B7F97_5EE3_4FBE_920 }}'
          channelId: live
          projectId: project-841b7f97-5ee3-4fbe-920
