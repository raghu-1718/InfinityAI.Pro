name: Deploy Production Stack (AWS + GCP)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag for all engine containers (e.g., latest, git sha)'
        required: true
        default: 'latest'
      dry_run:
        description: 'Set to true to run validation without deploying (string true/false to avoid 422 bug)'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write # Required for GCP and AWS OIDC authentication

jobs:
  #########################################
  # DEPLOY ENGINES A & B to GCP CLOUD RUN
  #########################################
  deploy-gcp-engines:
    name: Deploy Engines A, B & Ultra to GCP
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - engine: engine-a-market-data
            service_name: infinityai-engine-a
            context: engines/engine-a-market-data
          - engine: engine-b-ai-ml
            service_name: infinityai-engine-b
            context: engines/engine-b-ai-ml
          - engine: engine-ultra-aggressive
            service_name: infinityai-ultra-aggressive
            context: engines/engine-ultra-aggressive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dry Run Notice (GCP Job)
        if: "${{ github.event.inputs.dry_run == 'true' }}"
        run: echo "[DRY RUN] Skipping GCP auth & deployment for ${{ matrix.service_name }}"

      - name: Authenticate to Google Cloud
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Build & Push (GCP)
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would build & push ${{ matrix.service_name }} from ${{ matrix.context }}"
            exit 0
          fi
          gcloud builds submit '${{ matrix.context }}' \
            --tag '${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/infinityai-repo/${{ matrix.service_name }}:${{ github.event.inputs.image_tag }}'

      - name: Deploy (Cloud Run)
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would deploy Cloud Run service ${{ matrix.service_name }}"
            exit 0
          fi
          gcloud run deploy '${{ matrix.service_name }}' \
            --image '${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/infinityai-repo/${{ matrix.service_name }}:${{ github.event.inputs.image_tag }}' \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated

  #########################################
  # DEPLOY ENGINES C & D to AWS ECS
  #########################################
  deploy-aws-engines:
    name: Deploy Engines C & D to AWS ECS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [engine-c-execution, engine-d-chatbot]
        include:
          - engine: engine-c-execution
            container_name: engine-c-execution
            service_name: infinityai-engine-c-service
            task_family: infinityai-engine-c
            service_name_secret: ECS_SERVICE_NAME_C
            context: engines/engine-c-execution
          - engine: engine-d-chatbot
            container_name: engine-d-chatbot
            service_name: infinityai-engine-d-service
            task_family: infinityai-engine-d
            service_name_secret: ECS_SERVICE_NAME_D
            context: engines/engine-d-chatbot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dry Run Notice (AWS ECS Job)
        if: "${{ github.event.inputs.dry_run == 'true' }}"
        run: echo "[DRY RUN] Skipping AWS auth & ECS deployment for ${{ matrix.engine }}"

      - name: Configure AWS credentials
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: infinityai-${{ matrix.engine }} # normalized repository name
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would build and push image for ${{ matrix.engine }} to ECR"
            echo "image=dry-run-image" >> $GITHUB_OUTPUT
            exit 0
          fi
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f ${{ matrix.context }}/Dockerfile ${{ matrix.context }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ matrix.task_family }} --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service_name }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Dry Run Notice
        if: "${{ github.event.inputs.dry_run == 'true' }}"
        run: echo "[DRY RUN] Would deploy task definition for service ${{ matrix.service_name }}"

  #########################################
  # DEPLOY FRONTEND TO AWS S3/CLOUDFRONT
  #########################################
  deploy-frontend-aws:
    name: Deploy Frontend to AWS S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dry Run Notice (Frontend)
        if: "${{ github.event.inputs.dry_run == 'true' }}"
        run: echo "[DRY RUN] Skipping AWS auth & frontend deployment"

      - name: Configure AWS credentials
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Node.js
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Build Frontend
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        working-directory: frontend/web-app
        run: |
          npm ci
          npm run build

      - name: Deploy to S3
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        working-directory: frontend/web-app
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would sync build/ to S3 bucket ${{ secrets.AWS_S3_BUCKET_FRONTEND }}"
            exit 0
          fi
          aws s3 sync build/ s3://${{ secrets.AWS_S3_BUCKET_FRONTEND }} --delete

      - name: Invalidate CloudFront Cache
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would invalidate CloudFront distribution ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}"
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  #########################################
  # SUMMARY
  #########################################
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-gcp-engines, deploy-aws-engines, deploy-frontend-aws]
    steps:
      - name: Report Success
        run: |
          echo "✅✅✅"
          echo "All components deployed successfully to AWS and GCP!"
          echo "Application URL: https://infinityai.pro"
