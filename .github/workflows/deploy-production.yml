name: Deploy Production Stack (AWS + GCP)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag for all engine containers (e.g., latest, git sha)'
        required: true
        default: 'latest'
      dry_run:
        description: 'Set to true to run validation without deploying (string true/false to avoid 422 bug)'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write # Required for GCP and AWS OIDC authentication

jobs:
  #########################################
  # DEPLOY ENGINES A & B to GCP CLOUD RUN
  #########################################
  deploy-gcp-engines:
    name: "Deploy Engine: ${{ matrix.engine }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: engine-a-market-data
            service_name: infinityai-engine-a
            image_name: infinityai-engine-a
            dockerfile: backend/Dockerfile.engine-a
          - engine: engine-b-ai-ml
            service_name: infinityai-engine-b
            image_name: infinityai-engine-b
            dockerfile: backend/Dockerfile.engine-b
          - engine: engine-ultra-aggressive
            service_name: infinityai-ultra-aggressive
            image_name: infinityai-ultra-aggressive
            dockerfile: backend/engines/engine-ultra-aggressive/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define SHA short
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Dry Run Notice (GCP Job)
        if: "${{ github.event.inputs.dry_run == 'true' }}"
        run: echo "[DRY RUN] Skipping GCP auth & deployment for ${{ matrix.service_name }}"

      - name: Authenticate to Google Cloud
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        id: gcp-auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform'
          export_environment_variables: true
          token_format: 'access_token'
          access_token_lifetime: '3600s'

      - name: Set up Cloud SDK
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: List files for debugging
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: ls -R

      - name: Ensure Artifact Registry repository exists
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          if ! gcloud artifacts repositories describe ${{ secrets.GCP_ARTIFACT_REGISTRY_REPO_NAME }} --location=${{ secrets.GCP_REGION }} --project=${{ secrets.GCP_PROJECT_ID }} --quiet; then
            echo "Artifact Registry repository '${{ secrets.GCP_ARTIFACT_REGISTRY_REPO_NAME }}' not found, creating it..."
            gcloud artifacts repositories create ${{ secrets.GCP_ARTIFACT_REGISTRY_REPO_NAME }} \
              --repository-format=docker \
              --location=${{ secrets.GCP_REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --description="InfinityAI Docker repository"
          else
            echo "Artifact Registry repository '${{ secrets.GCP_ARTIFACT_REGISTRY_REPO_NAME }}' already exists."
          fi

      - name: Docker login to Artifact Registry
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build & Push (GCP)
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          docker build -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_REPO_NAME }}/${{ matrix.image_name }}:${{ steps.vars.outputs.sha_short }} -f ${{ matrix.dockerfile }} backend
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_REPO_NAME }}/${{ matrix.image_name }}:${{ steps.vars.outputs.sha_short }}

      - name: Deploy (Cloud Run)
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          # Add GPU flags and minimum resources for Engine B
          GPU_FLAGS=""
          if [ "${{ matrix.service_name }}" = "infinityai-engine-b" ]; then
            GPU_FLAGS="--gpu 1 --gpu-type nvidia-l4 --cpu 4 --memory 16Gi"
          fi
          gcloud run deploy ${{ matrix.service_name }} \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_REPO_NAME }}/${{ matrix.image_name }}:${{ steps.vars.outputs.sha_short }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            $GPU_FLAGS

  #########################################
  # DEPLOY ENGINES C & D to AWS ECS
  #########################################
  deploy-aws-engines:
    name: Deploy Engines C & D to AWS ECS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [engine-c-execution, engine-d-chatbot]
        include:
          - engine: engine-c-execution
            container_name: infinityai-engine-c
            service_name: infinityai-engine-c-service
            task_family: infinityai-engine-c
            dockerfile: backend/Dockerfile.engine-c
            ecr_repo: infinityai-engine-c
          - engine: engine-d-chatbot
            container_name: infinityai-engine-d
            service_name: infinityai-engine-d-service
            task_family: infinityai-engine-d
            dockerfile: backend/Dockerfile.engine-d
            ecr_repo: infinityai-engine-d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dry Run Notice (AWS ECS Job)
        if: "${{ github.event.inputs.dry_run == 'true' }}"
        run: echo "[DRY RUN] Skipping AWS auth & ECS deployment for ${{ matrix.engine }}"

      - name: Configure AWS credentials
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: List files for debugging
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: ls -R

      - name: Ensure ECR repository exists
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        env:
          ECR_REPOSITORY: ${{ matrix.ecr_repo }}
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY"

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.ecr_repo }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would build and push image for ${{ matrix.engine }} to ECR"
            echo "image=dry-run-image" >> $GITHUB_OUTPUT
            exit 0
          fi
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f ${{ matrix.dockerfile }} backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          aws ecs describe-task-definition --task-definition ${{ matrix.task_family }} --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        id: deploy-ecs-task
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service_name }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
          wait-for-minutes: 30 # Increased timeout

      - name: Report ECS deployment failure
        if: failure()
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
          ECS_SERVICE: ${{ matrix.service_name }}
          ENGINE_NAME: ${{ matrix.engine }}
        run: |
          echo "::error::ECS deployment for $ENGINE_NAME failed."
          echo "Fetching last 200 service events for debugging..."
          aws ecs describe-services --cluster "$ECS_CLUSTER_NAME" --services "$ECS_SERVICE" --query 'services[0].events' --output text | head -n 200

  #########################################
  # DEPLOY FRONTEND TO AWS S3/CLOUDFRONT
  #########################################
  deploy-frontend-aws:
    name: Deploy Frontend to AWS S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dry Run Notice (Frontend)
        if: "${{ github.event.inputs.dry_run == 'true' }}"
        run: echo "[DRY RUN] Skipping AWS auth & frontend deployment"

      - name: Configure AWS credentials
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Node.js
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: List files for debugging
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: ls -R
        working-directory: ./frontend/web

      - name: Build Frontend
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          set -e
          echo "INFO: Running npm install in frontend/web"
          npm install
          echo "INFO: Running npm run build with CI=false"
          export CI=false
          npm run build
        working-directory: ./frontend/web

      - name: Create S3 bucket if it doesn't exist
        run: |
          if aws s3api head-bucket --bucket "${{ secrets.AWS_S3_BUCKET_FRONTEND }}" 2>/dev/null; then
            echo "Bucket ${{ secrets.AWS_S3_BUCKET_FRONTEND }} already exists."
          else
            echo "Bucket ${{ secrets.AWS_S3_BUCKET_FRONTEND }} does not exist. Creating it in region ${{ secrets.AWS_REGION }}..."
            if [ "${{ secrets.AWS_REGION }}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${{ secrets.AWS_S3_BUCKET_FRONTEND }}" --region "${{ secrets.AWS_REGION }}"
            else
              aws s3api create-bucket --bucket "${{ secrets.AWS_S3_BUCKET_FRONTEND }}" --region "${{ secrets.AWS_REGION }}" --create-bucket-configuration LocationConstraint="${{ secrets.AWS_REGION }}"
            fi
          fi

      - name: Deploy to S3
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        working-directory: ./frontend/web
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would sync build/ to S3 bucket ${{ secrets.AWS_S3_BUCKET_FRONTEND }}"
            exit 0
          fi
          aws s3 sync build/ s3://${{ secrets.AWS_S3_BUCKET_FRONTEND }} --delete

      - name: Invalidate CloudFront Cache
        if: "${{ github.event.inputs.dry_run != 'true' }}"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would invalidate CloudFront distribution ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}"
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  #########################################
  # SUMMARY
  #########################################
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-gcp-engines, deploy-aws-engines, deploy-frontend-aws]
    if: always()
    steps:
      - name: Report Result
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Completed validation without performing cloud actions."
          fi
          echo "✅ Workflow completed (status aggregation may include skipped steps)."
          echo "Application URL: https://infinityai.pro"
