# InfinityAI.Pro - Complete CI/CD Pipeline
# Deploys all 3 backend engines to Cloud Run and frontend to Firebase Hosting
# Triggers on push to main branch

name: 🚀 Deploy InfinityAI Production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/web-app/**'
      - 'firebase.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend Engines'
        required: false
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend'
        required: false
        default: true
        type: boolean

env:
  GCP_PROJECT_ID: after-yesterday-473512-k3
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/after-yesterday-473512-k3/infinityai

jobs:
  # ============================================
  # Detect Changes
  # ============================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      engine-a: ${{ steps.filter.outputs.engine-a }}
      engine-b: ${{ steps.filter.outputs.engine-b }}
      engine-c: ${{ steps.filter.outputs.engine-c }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine-a:
              - 'backend/engine-analytics/**'
            engine-b:
              - 'backend/engine-core/**'
            engine-c:
              - 'backend/engine-execution/**'
            frontend:
              - 'frontend/web-app/**'
              - 'firebase.json'

  # ============================================
  # Deploy Engine A (Orchestrator/Risk)
  # ============================================
  deploy-engine-a:
    name: 🅰️ Deploy Engine A
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.engine-a == 'true' || github.event.inputs.deploy_backend == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/engine-a:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/engine-a:latest"
          docker build -t $IMAGE -t $IMAGE_LATEST backend/engine-analytics
          docker push $IMAGE
          docker push $IMAGE_LATEST

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy engine-a \
            --image=${{ env.ARTIFACT_REGISTRY }}/engine-a:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},ENGINE_B_URL=https://engine-b-573866363639.us-central1.run.app,ENGINE_C_URL=https://engine-c-573866363639.us-central1.run.app" \
            --set-secrets="DHAN_CLIENT_ID=dhan-client-id:latest,DHAN_API_SECRET=dhan-api-secret:latest,DHAN_ACCESS_TOKEN=dhan-access-token:latest"

      - name: Health Check
        run: |
          sleep 30
          curl -sf https://engine-a-573866363639.us-central1.run.app/health || echo "Warning: Health check failed"

  # ============================================
  # Deploy Engine B (AI/ML Intelligence)
  # ============================================
  deploy-engine-b:
    name: 🅱️ Deploy Engine B
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.engine-b == 'true' || github.event.inputs.deploy_backend == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/engine-b:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/engine-b:latest"
          docker build -t $IMAGE -t $IMAGE_LATEST backend/engine-core
          docker push $IMAGE
          docker push $IMAGE_LATEST

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy engine-b \
            --image=${{ env.ARTIFACT_REGISTRY }}/engine-b:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=4Gi \
            --cpu=2 \
            --timeout=600 \
            --concurrency=50 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},ENGINE_A_URL=https://engine-a-573866363639.us-central1.run.app,ENGINE_C_URL=https://engine-c-573866363639.us-central1.run.app" \
            --set-secrets="DHAN_CLIENT_ID=dhan-client-id:latest,DHAN_API_SECRET=dhan-api-secret:latest,DHAN_ACCESS_TOKEN=dhan-access-token:latest,GEMINI_API_KEY=gemini-api-key:latest"

      - name: Health Check
        run: |
          sleep 45
          curl -sf https://engine-b-573866363639.us-central1.run.app/health || echo "Warning: Health check failed"

  # ============================================
  # Deploy Engine C (Execution)
  # ============================================
  deploy-engine-c:
    name: 🇨 Deploy Engine C
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.engine-c == 'true' || github.event.inputs.deploy_backend == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/engine-c:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/engine-c:latest"
          docker build -t $IMAGE -t $IMAGE_LATEST backend/engine-execution
          docker push $IMAGE
          docker push $IMAGE_LATEST

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy engine-c \
            --image=${{ env.ARTIFACT_REGISTRY }}/engine-c:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --timeout=300 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }},ENGINE_A_URL=https://engine-a-573866363639.us-central1.run.app,ENGINE_B_URL=https://engine-b-573866363639.us-central1.run.app" \
            --set-secrets="DHAN_CLIENT_ID=dhan-client-id:latest,DHAN_API_SECRET=dhan-api-secret:latest,DHAN_ACCESS_TOKEN=dhan-access-token:latest"

      - name: Health Check
        run: |
          sleep 30
          curl -sf https://engine-c-573866363639.us-central1.run.app/health || echo "Warning: Health check failed"

  # ============================================
  # Deploy Frontend to Firebase Hosting
  # ============================================
  deploy-frontend:
    name: 🌐 Deploy Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.deploy_frontend == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/web-app
        run: npm ci

      - name: Build Next.js App
        working-directory: frontend/web-app
        run: npm run build
        env:
          NEXT_PUBLIC_ENGINE_A_URL: https://engine-a-573866363639.us-central1.run.app
          NEXT_PUBLIC_ENGINE_B_URL: https://engine-b-573866363639.us-central1.run.app
          NEXT_PUBLIC_ENGINE_C_URL: https://engine-c-573866363639.us-central1.run.app

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.GCP_PROJECT_ID }}
          channelId: live

  # ============================================
  # Post-Deployment Verification
  # ============================================
  verify-deployment:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-engine-a, deploy-engine-b, deploy-engine-c, deploy-frontend]
    if: always() && (needs.deploy-engine-a.result == 'success' || needs.deploy-engine-b.result == 'success' || needs.deploy-engine-c.result == 'success' || needs.deploy-frontend.result == 'success')

    steps:
      - name: Check Engine A Health
        run: |
          echo "🔍 Checking Engine A..."
          curl -sf https://engine-a-573866363639.us-central1.run.app/health | jq '.' || echo "⚠️ Engine A health check failed"

      - name: Check Engine B Health
        run: |
          echo "🔍 Checking Engine B..."
          curl -sf https://engine-b-573866363639.us-central1.run.app/health | jq '.' || echo "⚠️ Engine B health check failed"

      - name: Check Engine C Health
        run: |
          echo "🔍 Checking Engine C..."
          curl -sf https://engine-c-573866363639.us-central1.run.app/health | jq '.' || echo "⚠️ Engine C health check failed"

      - name: Check Frontend
        run: |
          echo "🔍 Checking Frontend..."
          curl -sf https://after-yesterday-473512-k3.web.app -o /dev/null && echo "✅ Frontend is live" || echo "⚠️ Frontend check failed"

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "🎉 DEPLOYMENT SUMMARY"
          echo "=========================================="
          echo "Engine A: https://engine-a-573866363639.us-central1.run.app"
          echo "Engine B: https://engine-b-573866363639.us-central1.run.app"
          echo "Engine C: https://engine-c-573866363639.us-central1.run.app"
          echo "Frontend: https://after-yesterday-473512-k3.web.app"
          echo "=========================================="
