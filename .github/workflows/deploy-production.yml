# InfinityAI.Pro - 100% GCP & Firebase CI/CD Pipeline
# Deploys FastAPI engines (A, B, C) to GCP Cloud Run via Google Workload Identity Federation (WIF)
# Deploys frontend to Firebase Hosting

name: 🚀 Deploy InfinityAI GCP Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: "project-841b7f97-5ee3-4fbe-920"
  GCP_REGION: "asia-south1"
  WIF_PROVIDER: "projects/313407263327/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  SERVICE_ACCOUNT: "github-actions-deployer@project-841b7f97-5ee3-4fbe-920.iam.gserviceaccount.com"

jobs:
  # ============================================
  # 1. Google Cloud Authentication via WIF
  # ============================================
  deploy-backend-cloud-run:
    name: ☁️ GCP Cloud Run Engines Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: "access_token"
          access_token_lifetime: "3600s"
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker to push to Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # Build & Deploy Engine B (ML Intelligence & Model Vault Bundle)
      - name: Build & Deploy Engine B
        run: |
          gcloud builds submit --config=cloudbuild_engine_b.yaml --project=${{ env.GCP_PROJECT_ID }} --timeout=1800s .

      # Deploy Engine A (Orchestrator & VPC Proxy)
      - name: Build & Deploy Engine A
        run: |
          gcloud builds submit --config=cloudbuild_engine_a.yaml --project=${{ env.GCP_PROJECT_ID }} --timeout=1800s .

      # Deploy Engine C (Execution Gateway & Broker Link)
      - name: Build & Deploy Engine C
        run: |
          gcloud builds submit --config=cloudbuild_engine_c.yaml --project=${{ env.GCP_PROJECT_ID }} --timeout=1800s .

  # ============================================
  # 2. Deploy Frontend to Firebase Hosting
  # ============================================
  deploy-frontend-firebase:
    name: 🔥 Firebase Hosting Deployment
    runs-on: ubuntu-latest
    needs: deploy-backend-cloud-run
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: "access_token"
          access_token_lifetime: "3600s"
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/web-app
        run: npm ci --include=optional

      - name: Build Next.js Web Application
        working-directory: frontend/web-app
        run: npm run build
        env:
          NEXT_PUBLIC_ENGINE_A_URL: https://engine-a-r2f5flt77q-el.a.run.app
          NEXT_PUBLIC_ENGINE_B_URL: https://engine-a-r2f5flt77q-el.a.run.app
          NEXT_PUBLIC_ENGINE_C_URL: https://engine-c-r2f5flt77q-el.a.run.app

      - name: Deploy to Firebase Hosting via CLI
        run: npx firebase-tools deploy --only hosting --project ${{ env.GCP_PROJECT_ID }} --non-interactive
