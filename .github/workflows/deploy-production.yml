name: Deploy Frontend to Production

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: infinity-ai-5ec7c
  REGION: us-central1

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Google Auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: "Configure Docker auth for Artifact Registry/GCR"
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: "Build Docker image locally"
        working-directory: frontend
        run: |
          docker build -t gcr.io/$PROJECT_ID/infinityai-frontend:latest .

      - name: "Push Docker image"
        run: |
          docker push gcr.io/$PROJECT_ID/infinityai-frontend:latest

      - name: "Deploy to Cloud Run"
        run: |
          gcloud run deploy "infinityai-frontend" \
            --image="gcr.io/$PROJECT_ID/infinityai-frontend:latest" \
            --platform=managed \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --allow-unauthenticated \
            --quiet
