name: Engine D CI

on:
  push:
    branches: [ main ]
    paths:
      - 'infinityai-pro/backend/engines/engine-d/**'
      - '.github/workflows/ci-engine-d.yml'
  pull_request:
    paths:
      - 'infinityai-pro/backend/engines/engine-d/**'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
            python-version: '3.11'
      - name: Install minimal deps
        working-directory: infinityai-pro/backend/engines/engine-d
        run: |
          if [ -f requirements.txt ]; then grep -E '^(fastapi|uvicorn|pydantic|httpx|redis|numpy|pandas|textblob|nltk)' requirements.txt > req.txt || true; fi
          pip install --no-cache-dir -r req.txt || true
          pip install textblob nltk || true
          python -c "import nltk;[nltk.download(x,quiet=True) for x in ['punkt','vader_lexicon']];print('NLTK data ready')"
      - name: Import smoke
        working-directory: infinityai-pro/backend/engines/engine-d
        env:
          ENABLE_TRANSFORMERS: 'false'
        run: python -c "import sys;\ntry:\n import main; print('Engine D import OK (light mode)')\nexcept Exception as e:\n print('Engine D import failed:', e); sys.exit(1)"