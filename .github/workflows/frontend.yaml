
name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'frontend-new/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 'Create a .env file'
        run: |
          echo "VITE_API_KEY=\${{ secrets.VITE_API_KEY }}" > frontend-new/.env.local
          echo "VITE_AUTH_DOMAIN=\${{ secrets.VITE_AUTH_DOMAIN }}" >> frontend-new/.env.local
          echo "VITE_PROJECT_ID=\${{ secrets.VITE_PROJECT_ID }}" >> frontend-new/.env.local
          echo "VITE_STORAGE_BUCKET=\${{ secrets.VITE_STORAGE_BUCKET }}" >> frontend-new/.env.local
          echo "VITE_MESSAGING_SENDER_ID=\${{ secrets.VITE_MESSAGING_SENDER_ID }}" >> frontend-new/.env.local
          echo "VITE_APP_ID=\${{ secrets.VITE_APP_ID }}" >> frontend-new/.env.local
          echo "VITE_MEASUREMENT_ID=\${{ secrets.VITE_MEASUREMENT_ID }}" >> frontend-new/.env.local

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'infinityai-frontend'
          source: './frontend-new'
          region: 'us-central1'

