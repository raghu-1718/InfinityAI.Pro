name: CI - Build frontend & engines

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  FRONTEND_DIR: frontend-new

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Build Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_DIR }}/dist

  engines:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      matrix:
        engine: [engine-a-market-data, engine-b-ai-ml, engine-c-execution, engine-d-chatbot, engine-ultra-aggressive]
    name: Build engine ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install requirements (if any)
        working-directory: backend/engines/${{ matrix.engine }}
        run: |
          if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi
      - name: Import smoke test
        working-directory: backend/engines/${{ matrix.engine }}
        run: |
          python -c "import sys; print('import test for engine: ${{ matrix.engine }}');"
      - name: Build docker image
        run: |
          docker build -t ${{ github.repository }}:${{ matrix.engine }} backend/engines/${{ matrix.engine }}
      - name: Save image info
        run: echo "IMAGE_URI=docker://${{ github.repository }}:${{ matrix.engine }}" > image_info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.engine }}
          path: image_info.txt
