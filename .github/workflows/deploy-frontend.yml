name: Deploy Frontend (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - 'frontend-new/**'
  workflow_dispatch:

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend-new
        run: npm ci

      - name: Build frontend
        working-directory: frontend-new
        run: npm run build

      - name: Check build output exists
        run: |
          if [ ! -d "frontend-new/dist" ]; then
            echo "Build output directory frontend-new/dist does not exist!"
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INFINITY_AI_5EC7C }}
          channelId: live
          projectId: infinity-ai-5ec7c
