name: Deploy Engine D to AWS ECS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'infinityai-engine-d' }}
  IMAGE_TAG: latest
  TASK_FAMILY: infinityai-engine-d
  CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          set -e
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${{ env.ECR_REPOSITORY }}" 1>/dev/null

      - name: Build, tag, and push image to ECR
        working-directory: ./infinityai-pro/backend/engines/engine-d
        run: |
          ECR_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV
          docker build -t "$ECR_URI" .
          docker push "$ECR_URI"

      - name: Prepare task definition
        run: |
          set -e
          # Use existing taskdef template and swap image URI
          cp infinityai-pro/infinityai-engine-d-taskdef.json taskdef.json
          jq ".containerDefinitions[0].image=\"$ECR_URI\"" taskdef.json > taskdef.updated.json
          mv taskdef.updated.json taskdef.json
          echo "Prepared task definition:" && cat taskdef.json

      - name: Register task definition
        id: register-task
        run: |
          REVISION=$(aws ecs register-task-definition --cli-input-json file://taskdef.json --query "taskDefinition.revision" --output text)
          echo "REVISION=$REVISION" >> $GITHUB_ENV
          echo "Registered task revision: $REVISION"

      - name: Validate required inputs
        run: |
          if [ -z "${{ env.CLUSTER_NAME }}" ] || [ -z "${{ env.ECS_SERVICE_NAME }}" ]; then
            echo "ECS_CLUSTER_NAME and ECS_SERVICE_NAME secrets are required." >&2
            exit 1
          fi

      - name: Update ECS service to new revision
        run: |
          SERVICE="${{ env.ECS_SERVICE_NAME }}"
          aws ecs update-service \
            --cluster "${{ env.CLUSTER_NAME }}" \
            --service "$SERVICE" \
            --task-definition "${{ env.TASK_FAMILY }}" \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          SERVICE="${{ env.ECS_SERVICE_NAME }}"
          aws ecs wait services-stable --cluster "${{ env.CLUSTER_NAME }}" --services "$SERVICE"

      - name: Output summary
        run: |
          echo "Engine D deployed with image: $ECR_URI"
          echo "Task family: ${{ env.TASK_FAMILY }}, revision: $REVISION"