name: Trigger Deploy Production (via push)

on:
  push:
    branches:
      - 'trigger/deploy-production'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch deploy-production workflow
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = '.github/workflows/deploy-production.yml';
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: 'main',
              inputs: { dry_run: 'false', image_tag: 'latest' }
            });
            core.info('Dispatched deploy-production workflow with dry_run=false');
