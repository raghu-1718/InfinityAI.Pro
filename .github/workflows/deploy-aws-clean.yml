name: Deploy - AWS ECS (clean)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g., latest)'
        required: true
        default: 'latest'
      dry_run:
        description: 'If true, only simulate deploy'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build docker image for engine-c
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          LOCAL_IMAGE="infinityai/engine-c:${IMAGE_TAG}"
          docker build -t "${LOCAL_IMAGE}" backend/engines/engine-c-execution
      - name: Ensure ECR repo exists and push image (dry-run safe)
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REPO_NAME="infinityai-engine-c"
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${ECR_REPO_NAME}:${IMAGE_TAG}"
          DRY_RUN=${{ github.event.inputs.dry_run }}
          echo "ECR target will be ${ECR_URI} (dry_run=${DRY_RUN})"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN: would create ECR repo (if missing) and push ${LOCAL_IMAGE} -> ${ECR_URI}"
          else
            aws ecr describe-repositories --repository-names "${ECR_REPO_NAME}" || aws ecr create-repository --repository-name "${ECR_REPO_NAME}"
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            docker tag "${LOCAL_IMAGE}" "${ECR_URI}"
            docker push "${ECR_URI}"
          fi
      - name: Prepare & call ECS deploy script
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/infinityai-engine-c:${IMAGE_TAG}"
          DRY_RUN=${{ github.event.inputs.dry_run }}
          echo "Calling ECS deploy script with IMAGE_URI=${IMAGE_URI} (dry_run=${DRY_RUN})"
          bash scripts/deploy_ecs.sh "${IMAGE_URI}" "${{ secrets.ECS_CLUSTER_NAME }}" "${{ secrets.ECS_SERVICE_NAME }}" "task-def-engine-c.json" "${DRY_RUN}"
