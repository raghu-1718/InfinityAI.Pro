name: Deploy Multi-Cloud Monorepo

on:
  push:
    branches:
      - main
      - recovery/v4.6-stabilization
  workflow_dispatch:

jobs:
  # --- Job 1: Test Engine-C ---
  test-engine-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Engine-C Dependencies
        working-directory: ./engines/engine-c-execution
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Engine-C Pytest
        working-directory: ./engines/engine-c-execution
        run: pytest -q

  # --- Job 2: Deploy Frontend to Vercel ---
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          vercel-args: '--prod'
          working-directory: ./frontend
          scope: ${{ secrets.VERCEL_ORG_ID }}
        env:
          VITE_API_URL: https://engines.infinityai.pro
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
          VITE_API_BASE: https://engines.infinityai.pro
          VITE_WS_BASE: wss://engines.infinityai.pro

  # --- Job 3: Deploy Webhooks API to Vercel ---
  deploy-webhooks:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    defaults:
      run:
        working-directory: ./api-webhooks
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Webhooks API to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEBHOOKS }}
          vercel-args: '--prod'
          working-directory: ./api-webhooks
          scope: ${{ secrets.VERCEL_ORG_ID }}
        env:
          DHAN_WEBHOOK_SECRET: ${{ secrets.DHAN_WEBHOOK_SECRET }}
          ENGINE_C_INTERNAL_URL: https://engines.infinityai.pro/engine-c
          FRONTEND_VERCEL_URL: https://infinityai.pro

  # --- Job 4: Deploy Firebase Functions ---
  deploy-functions:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase Functions
        run: firebase deploy --only functions --project infinitygt-b2287 --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # --- Job 5: Deploy Engine-C to Vercel ---
  deploy-engine-c:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Engine C to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ENGINE_C }}
          vercel-args: '--prod'
          working-directory: ./engines/engine-c-execution
          scope: ${{ secrets.VERCEL_ORG_ID }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}

  # --- Job 6: Deploy Engine-A to Google Cloud Run ---
  deploy-engine-a:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - name: Deploy Engine A to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: infinityai-engine-a
          region: us-central1
          source: ./engines/engine-a
          env_vars: |
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}

  # --- Job 7: Deploy Engine-B to Google Cloud Run ---
  deploy-engine-b:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories create cloud-run-source-deploy \
            --repository-format=docker \
            --location=us-central1 \
          || echo "Repo exists"
      - name: Build and push image for Engine B
        working-directory: ./engines/engine-b
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/engine-b:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          gcloud builds submit --tag "$IMAGE" --project ${{ secrets.GCP_PROJECT_ID }}
      - name: Deploy Engine B to Cloud Run (image)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: infinityai-engine-b
          region: us-central1
          image: ${{ env.IMAGE }}
          env_vars: |
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}

  # --- Job 8: Deploy Engine-D to Vercel ---
  deploy-engine-d:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Engine D to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ENGINE_D }}
          vercel-args: '--prod'
          working-directory: ./engines/engine-d
          scope: ${{ secrets.VERCEL_ORG_ID }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ENGINE_A_URL: ${{ secrets.ENGINE_A_URL }}
          ENGINE_B_URL: ${{ secrets.ENGINE_B_URL }}
