name: Deploy Multi-Cloud Monorepo

on:
  push:
    branches:
      - main
      - recovery/v4.6-stabilization
  workflow_dispatch:

jobs:
  # --- Job 1: Test Engine-C ---
  test-engine-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Engine-C Dependencies
        working-directory: ./engines/engine-c-execution
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Engine-C Pytest
        working-directory: ./engines/engine-c-execution
        run: pytest -q

  # --- Job 2: Deploy Frontend to Firebase Hosting ---
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase Hosting
        working-directory: .
        run: firebase deploy --only hosting --project after-yesterday-473512-k3 --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # --- Job 3: Deploy Firebase Functions ---
  deploy-functions:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase Functions
        run: firebase deploy --only functions --project after-yesterday-473512-k3 --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # --- Job 4: Deploy Engines to Google Cloud Run (Cost Optimized) ---
  deploy-engines-gcp:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    strategy:
      matrix:
        engine: [engine-a, engine-b, engine-c-execution, engine-d]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy ${{ matrix.engine }} to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: us-central1
        run: |
          set -euo pipefail
          ENGINE="${{ matrix.engine }}"
          # Use consistent service naming: infinityai-{engine-name}
          # Cost optimization: engines A/B/D use 0.5 CPU + 256Mi, engine C uses 1 CPU + 512Mi
          case "$ENGINE" in
            engine-a) 
              SERVICE_NAME="infinityai-engine-a"
              CPU="0.5"
              MEMORY="256Mi"
              MAX_INSTANCES=5
              ;;
            engine-b) 
              SERVICE_NAME="infinityai-engine-b"
              CPU="0.5"
              MEMORY="256Mi"
              MAX_INSTANCES=5
              ;;
            engine-c-execution) 
              SERVICE_NAME="infinityai-engine-c-execution"
              CPU="1"
              MEMORY="512Mi"
              MAX_INSTANCES=10
              ;;
            engine-d) 
              SERVICE_NAME="infinityai-engine-d"
              CPU="0.5"
              MEMORY="256Mi"
              MAX_INSTANCES=5
              ;;
            *) echo "Unknown engine $ENGINE"; exit 1;;
          esac
          SRC_PATH="./engines/${ENGINE}"
          if [ ! -d "$SRC_PATH" ]; then
            echo "Source path not found: $SRC_PATH"; exit 1;
          fi
          echo "Deploying $ENGINE as Cloud Run service $SERVICE_NAME from $SRC_PATH"
          echo "  CPU: $CPU, Memory: $MEMORY, Max Instances: $MAX_INSTANCES"
          # GCP requires concurrency <= 80 when CPU < 1
          if [ "$CPU" = "0.5" ]; then
            echo "  Setting concurrency to 80 for CPU < 1"
            gcloud run deploy "$SERVICE_NAME" \
              --source "$SRC_PATH" \
              --region "$REGION" \
              --project "$GCP_PROJECT_ID" \
              --allow-unauthenticated \
              --min-instances 0 \
              --max-instances "$MAX_INSTANCES" \
              --cpu "$CPU" \
              --memory "$MEMORY" \
              --timeout 300 \
              --concurrency 80 \
              --quiet
          else
            gcloud run deploy "$SERVICE_NAME" \
              --source "$SRC_PATH" \
              --region "$REGION" \
              --project "$GCP_PROJECT_ID" \
              --allow-unauthenticated \
              --min-instances 0 \
              --max-instances "$MAX_INSTANCES" \
              --cpu "$CPU" \
              --memory "$MEMORY" \
              --timeout 300 \
              --quiet
          fi

      - name: Output Service URL
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: us-central1
        run: |
          ENGINE="${{ matrix.engine }}"
          case "$ENGINE" in
            engine-a) SERVICE_NAME="infinityai-engine-a" ;;
            engine-b) SERVICE_NAME="infinityai-engine-b" ;;
            engine-c-execution) SERVICE_NAME="infinityai-engine-c-execution" ;;
            engine-d) SERVICE_NAME="infinityai-engine-d" ;;
          esac
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')
          echo "Cloud Run URL for $ENGINE: $URL"
