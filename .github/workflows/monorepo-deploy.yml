name: Deploy Multi-Cloud Monorepo

on:
  push:
    branches:
      - main
      - recovery/v4.6-stabilization
  workflow_dispatch:

jobs:
  # --- Job 1: Test Engine-C ---
  test-engine-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Engine-C Dependencies
        working-directory: ./engines/engine-c-execution
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Engine-C Pytest
        working-directory: ./engines/engine-c-execution
        run: pytest -q

  # --- Job 2: Deploy Frontend to Vercel ---
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          working-directory: ./frontend
          vercel-args: '--prod'

  # --- Job 3: Deploy Webhooks API to Vercel ---
  deploy-webhooks:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Webhooks API to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEBHOOKS }}
          working-directory: ./api-webhooks
          vercel-args: '--prod'

  # --- Job 4: Deploy Firebase Functions ---
  deploy-functions:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase Functions
        run: firebase deploy --only functions --project after-yesterday-473512-k3 --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # --- Job 5: Deploy Engines to Google Cloud Run ---
  deploy-engines-gcp:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    strategy:
      matrix:
        engine: [engine-a, engine-b, engine-c-execution, engine-d]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy ${{ matrix.engine }} to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: us-central1
        run: |
          set -euo pipefail
          ENGINE="${{ matrix.engine }}"
          case "$ENGINE" in
            engine-a) SERVICE_NAME="engine-a" ;;
            engine-b) SERVICE_NAME="engine-b-ai-ml-prod" ;;
            engine-c-execution) SERVICE_NAME="engine-c-execution-prod" ;;
            engine-d) SERVICE_NAME="engine-d-orchestration-prod" ;;
            *) echo "Unknown engine $ENGINE"; exit 1;;
          esac
          SRC_PATH="./engines/${ENGINE}"
          if [ ! -d "$SRC_PATH" ]; then
            echo "Source path not found: $SRC_PATH"; exit 1;
          fi
          echo "Deploying $ENGINE as Cloud Run service $SERVICE_NAME from $SRC_PATH"
          gcloud run deploy "$SERVICE_NAME" \
            --source "$SRC_PATH" \
            --region "$REGION" \
            --project "$GCP_PROJECT_ID" \
            --allow-unauthenticated \
            --quiet

      - name: Output Service URL
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: us-central1
        run: |
          ENGINE="${{ matrix.engine }}"
          case "$ENGINE" in
            engine-a) SERVICE_NAME="engine-a" ;;
            engine-b) SERVICE_NAME="engine-b-ai-ml-prod" ;;
            engine-c-execution) SERVICE_NAME="engine-c-execution-prod" ;;
            engine-d) SERVICE_NAME="engine-d-orchestration-prod" ;;
          esac
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')
          echo "Cloud Run URL for $ENGINE: $URL"
