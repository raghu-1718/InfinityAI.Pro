name: Deploy Multi-Cloud Monorepo

on:
  push:
    branches:
      - main
      - recovery/v4.6-stabilization
  workflow_dispatch:

jobs:
  # --- Job 1: Test Engine-C ---
  test-engine-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Engine-C Dependencies
        working-directory: ./engines/engine-c-execution
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Engine-C Pytest
        working-directory: ./engines/engine-c-execution
        run: pytest -q

  # --- Job 2: Deploy Frontend to Vercel ---
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Frontend to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v21
        with:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          WORKING_DIRECTORY: ./frontend
          PRODUCTION: true

  # --- Job 3: Deploy Webhooks API to Vercel ---
  deploy-webhooks:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Webhooks API to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v21
        with:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBHOOKS }}
          WORKING_DIRECTORY: ./api-webhooks
          PRODUCTION: true

  # --- Job 4: Deploy Firebase Functions ---
  deploy-functions:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase Functions
        run: firebase deploy --only functions --project infinitygt-b2287 --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # --- Job 5: Deploy Engine-C via Northflank ---
  deploy-engines-northflank:
    runs-on: ubuntu-latest
    needs: test-engine-c
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/recovery/v4.6-stabilization'
    strategy:
      matrix:
        engine: [engine-a, engine-b, engine-c, engine-d]
    steps:
      - name: Trigger Northflank deploy for ${{ matrix.engine }}
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT: ${{ secrets.NORTHFLANK_PROJECT }}
          NF_SERVICE_ENGINE_A: ${{ secrets.NF_SERVICE_ENGINE_A }}
          NF_SERVICE_ENGINE_B: ${{ secrets.NF_SERVICE_ENGINE_B }}
          NF_SERVICE_ENGINE_C: ${{ secrets.NF_SERVICE_ENGINE_C }}
          NF_SERVICE_ENGINE_D: ${{ secrets.NF_SERVICE_ENGINE_D }}
        run: |
          set -e
          if [ -z "$NORTHFLANK_API_TOKEN" ] || [ -z "$NORTHFLANK_PROJECT" ]; then
            echo "Missing Northflank secrets. Please set NORTHFLANK_API_TOKEN and NORTHFLANK_PROJECT."; exit 1;
          fi
          case "${{ matrix.engine }}" in
            engine-a) SERVICE="$NF_SERVICE_ENGINE_A" ;;
            engine-b) SERVICE="$NF_SERVICE_ENGINE_B" ;;
            engine-c) SERVICE="$NF_SERVICE_ENGINE_C" ;;
            engine-d) SERVICE="$NF_SERVICE_ENGINE_D" ;;
          esac
          if [ -z "$SERVICE" ]; then
            echo "Service slug for ${{ matrix.engine }} not set. Configure NF_SERVICE_* secrets."; exit 1;
          fi
          echo "Triggering redeploy for project=$NORTHFLANK_PROJECT service=$SERVICE"
          curl -fsS -X POST \
            -H "Authorization: Bearer $NORTHFLANK_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.northflank.com/v1/projects/$NORTHFLANK_PROJECT/services/$SERVICE/deployments" \
            -d '{"redeploy": true}' || { echo "Northflank API call failed"; exit 1; }

  # --- Job 6: Deploy Engine-A to Google Cloud Run ---
  # deploy-engine-a: removed (engines now deployed via Northflank)

  # --- Job 7: Deploy Engine-B to Google Cloud Run ---
  # deploy-engine-b: removed (engines now deployed via Northflank)

  # --- Job 8: Deploy Engine-D via Northflank ---
  # deploy-engine-d: removed (engines now deployed via Northflank)
