name: Trigger auto deployment for infinityai-app (DISABLED)

# Legacy Azure Container Apps workflow — disabled for AWS+GCP architecture.
# Kept for reference; manual dispatch allowed but job is guarded to never run.
on:
  # Manual trigger only
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: ${{ false }} # disabled
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.INFINITYAIAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.INFINITYAIAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.INFINITYAIAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: infinityaiacr.azurecr.io
          registryUsername: ${{ secrets.INFINITYAIAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.INFINITYAIAPP_REGISTRY_PASSWORD }}
          containerAppName: infinityai-app
          resourceGroup: infinityai-pro-rg
          imageToBuild: infinityaiacr.azurecr.io/infinityai-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


