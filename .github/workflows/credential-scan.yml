name: Credential scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run credential scan (dry-run)
        run: |
          chmod +x ./scripts/rotate_exposed_credentials.sh
          ./scripts/rotate_exposed_credentials.sh --dry-run | tee credential-scan-output.txt

      - name: Upload scan output
        uses: actions/upload-artifact@v4
        with:
          name: credential-scan-output
          path: credential-scan-output.txt
