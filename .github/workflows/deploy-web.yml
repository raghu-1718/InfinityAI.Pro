name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build_and_deploy_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: |
          echo "Listing frontend after build:"
          ls -la frontend/ || true
          echo "Listing frontend/dist:"
          ls -la frontend/dist/ || ls -la frontend/build/ || true
          if [ ! -d "frontend/dist" ]; then
            echo "❌ Build output directory frontend/dist does not exist!"
            exit 1
          fi
          echo "✅ Build output verified!"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_INFINITY_AI_5EC7C }}"
          channelId: live
          projectId: infinity-ai-5ec7c
