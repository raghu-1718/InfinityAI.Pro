name: Monorepo CI - Clean Frontend & Engines

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-new/package-lock.json
      - name: Install deps
        working-directory: frontend-new
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        working-directory: frontend-new
        run: npm run build

  engine-a:
    name: Engine A Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        working-directory: backend/engines/engine-a
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend, engine-a]
    steps:
      - run: echo "Clean monorepo CI completed."
