name: Nightly Frontend E2E Verifier

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch: # allow manual runs

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
      # Optional secrets - set in repo Settings > Secrets
      FIREBASE_TEST_EMAIL: ${{ secrets.FIREBASE_TEST_EMAIL }}
      FIREBASE_TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}
      # If provided, workflow will authenticate to GCP and run inventory/probes
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      # Optional toggle to enable full Playwright traces
      E2E_TRACE: ${{ github.event.inputs.enable_trace || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/e2e/cloud-verifier/frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Authenticate to GCP (optional)
        if: ${{ env.GCP_SA_KEY != '' }}
        run: |
          echo "Authenticating to GCP using service account key from secret"
          echo "$GCP_SA_KEY" > /tmp/gcp_key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp_key.json
          if [ -n "$GCP_PROJECT" ]; then
            gcloud config set project "$GCP_PROJECT"
          fi

      - name: Run inventory & probes (optional)
        run: |
          bash scripts/e2e/cloud-verifier/run_inventory.sh || echo "Inventory/probes partially failed"

      - name: Run frontend Playwright E2E
        working-directory: scripts/e2e/cloud-verifier/frontend
        env:
          BASE_URL: ${{ env.BASE_URL }}
          FIREBASE_TEST_EMAIL: ${{ env.FIREBASE_TEST_EMAIL }}
          FIREBASE_TEST_PASSWORD: ${{ env.FIREBASE_TEST_PASSWORD }}
          E2E_TRACE: ${{ env.E2E_TRACE }}
        run: |
          bash run_frontend_e2e.sh
        continue-on-error: true

      - name: Gather results and upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: |
            scripts/e2e/cloud-verifier/output/frontend
            scripts/e2e/cloud-verifier/output
            scripts/e2e/cloud-verifier/frontend/playwright-report

      - name: Fail on test errors
        if: ${{ failure() }}
        run: |
          echo "One or more verifications failed (see artifacts)." >&2
          exit 1
