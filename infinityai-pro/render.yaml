services:
  - type: web
    name: infinityai-backend
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DB_URL
        value: sqlite:///./chroma_db/chroma.sqlite3
      - key: SECRET_KEY
        value: supersecret
      - key: OPENAI_API_KEY
        fromSecret: openai-api-key
      - key: HF_TOKEN
        fromSecret: huggingface-token
      - key: RUNPOD_API_KEY
        fromSecret: runpod-api-key
      - key: ALPHA_VANTAGE_API_KEY
        fromSecret: alpha-vantage-key
      - key: VECTOR_DB_URL
        value: https://chroma-yqnp.onrender.com
      - key: OLLAMA_URL
        value: https://ollama-gyg4.onrender.com
      - key: FRONTEND_URL
        value: https://infinityai-frontend.onrender.com
      # Cloud Storage Configuration
      - key: STORAGE_PROVIDER
        value: aws  # or azure
      - key: AWS_S3_BUCKET
        fromSecret: aws-s3-bucket
      - key: AWS_ACCESS_KEY_ID
        fromSecret: aws-access-key-id
      - key: AWS_SECRET_ACCESS_KEY
        fromSecret: aws-secret-access-key
      - key: AZURE_STORAGE_ACCOUNT
        fromSecret: azure-storage-account
      - key: AZURE_STORAGE_KEY
        fromSecret: azure-storage-key
      - key: AZURE_CONTAINER
        value: infinityai-models
      # Multi-Cloud AI Configuration
      - key: AWS_SAGEMAKER_ENDPOINT
        fromSecret: aws-sagemaker-endpoint
      - key: AZURE_ML_ENDPOINT
        fromSecret: azure-ml-endpoint
      - key: AZURE_ML_KEY
        fromSecret: azure-ml-key
    healthCheckPath: /health
    disk:
      name: chroma-data
      mountPath: /opt/render/project/src/chroma_db
      sizeGB: 10

  - type: web
    name: infinityai-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: REACT_APP_API_URL
        value: https://infinityai-backend.onrender.com
      - key: NODE_ENV
        value: production

  - type: pserv
    name: chroma
    runtime: docker
    dockerfilePath: ./vectordb.Dockerfile
    dockerContext: .
    envVars:
      - key: CHROMA_SERVER_HOST
        value: 0.0.0.0
      - key: CHROMA_SERVER_HTTP_PORT
        value: 8000
    disk:
      name: chroma-data
      mountPath: /chroma
      sizeGB: 10

  - type: pserv
    name: ollama
    runtime: docker
    dockerfilePath: ./ollama.Dockerfile
    dockerContext: .
    envVars:
      - key: OLLAMA_HOST
        value: 0.0.0.0
      - key: OLLAMA_PORT
        value: 11434
    disk:
      name: ollama-data
      mountPath: /root/.ollama
      sizeGB: 10