# 🤖 InfinityAI.Pro - AI Trading Configuration
# Modify these settings to customize your trading behavior

[TRAILING_STOPS]
# Activate trailing when profit reaches this percentage
TRAILING_PROFIT_THRESHOLD = 6.0

# Trail stop this far behind the highest profit
TRAILING_DISTANCE = 3.0

# When profit reaches this level, activate high-profit protection
HIGH_PROFIT_THRESHOLD = 12.0

# Protect profits at this level when in high-profit mode
HIGH_PROFIT_PROTECTION = 6.0

[RISK_MANAGEMENT]
# Maximum percentage of capital per trade
MAX_POSITION_SIZE = 15.0

# Maximum daily loss percentage before stopping
MAX_DAILY_LOSS = 5.0

# Minimum confidence required to execute a trade
MIN_CONFIDENCE = 75.0

# Basic stop loss percentage (negative value)
BASIC_STOP_LOSS = -10.0

[EXECUTION_SETTINGS]
# Enable automatic trade execution (True/False)
AUTO_EXECUTE = True

# Time between trading cycles (seconds)
CYCLE_INTERVAL = 120

# Delay between individual orders (seconds)
ORDER_DELAY = 2

# Maximum number of concurrent positions
MAX_POSITIONS = 5

[SIGNAL_ANALYSIS]
# Enable NIFTY options trading
ENABLE_NIFTY = True

# Enable Bank NIFTY options trading
ENABLE_BANK_NIFTY = True

# Enable commodity trading (Crude Oil, etc.)
ENABLE_COMMODITIES = True

# Enable currency trading
ENABLE_CURRENCY = False

[POSITION_SIZING]
# Minimum capital required for NIFTY trades
NIFTY_MIN_CAPITAL = 5000

# Minimum capital required for Bank NIFTY trades
BANK_NIFTY_MIN_CAPITAL = 8000

# Minimum capital required for commodity trades
COMMODITY_MIN_CAPITAL = 6000

[MARKET_CONDITIONS]
# Trading hours (24-hour format)
MARKET_START_HOUR = 9
MARKET_END_HOUR = 15

# Days to trade (0=Monday, 6=Sunday)
TRADING_DAYS = [0, 1, 2, 3, 4]  # Monday to Friday

# Volatility threshold for signal generation
VOLATILITY_THRESHOLD = 0.25

[NOTIFICATIONS]
# Enable profit alerts
PROFIT_ALERTS = True

# Enable loss alerts  
LOSS_ALERTS = True

# Enable signal alerts
SIGNAL_ALERTS = True

# Enable execution alerts
EXECUTION_ALERTS = True

# Alert thresholds
PROFIT_ALERT_THRESHOLD = 5.0  # Alert when profit exceeds this %
LOSS_ALERT_THRESHOLD = -3.0   # Alert when loss exceeds this %

[ADVANCED_FEATURES]
# Enable AI confidence scoring
AI_CONFIDENCE_SCORING = True

# Enable market sentiment analysis
MARKET_SENTIMENT_ANALYSIS = True

# Enable volatility-based position sizing
VOLATILITY_POSITION_SIZING = True

# Enable correlation analysis
CORRELATION_ANALYSIS = True

# Enable sector rotation detection
SECTOR_ROTATION = False

[BACKTESTING]
# Enable strategy backtesting
ENABLE_BACKTESTING = False

# Historical data lookback period (days)
BACKTEST_PERIOD = 30

# Minimum trades for strategy validation
MIN_TRADES_VALIDATION = 10

[API_SETTINGS]
# Dhan API rate limits (requests per minute)
API_RATE_LIMIT = 30

# Request timeout (seconds)
REQUEST_TIMEOUT = 10

# Retry attempts for failed requests
MAX_RETRIES = 3

# Retry delay (seconds)
RETRY_DELAY = 1

# Example Usage:
# 1. Modify TRAILING_PROFIT_THRESHOLD to change when trailing starts
# 2. Adjust MAX_POSITION_SIZE to control risk per trade
# 3. Change MIN_CONFIDENCE to be more/less selective with signals
# 4. Enable/disable asset classes in SIGNAL_ANALYSIS section
# 5. Customize position sizing minimums for different instruments

# Safety Notes:
# - Test with small position sizes first
# - Monitor performance before increasing capital allocation
# - Keep stop losses tight initially
# - Review and adjust settings based on market conditions