version: '3.8'

services:
  # Event Bus - Apache Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: infinityai-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: infinityai-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      # Performance tuning for high-frequency trading
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      # Message retention and batching
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_CLEANUP_POLICY: delete
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Schema Registry for message schemas
  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    hostname: schema-registry
    container_name: infinityai-schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: infinityai-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data

  # PostgreSQL for trade ledger and application data
  postgres:
    image: postgres:15-alpine
    hostname: postgres
    container_name: infinityai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: infinityai
      POSTGRES_USER: infinityai
      POSTGRES_PASSWORD: infinityai_secure_pass
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  # TimescaleDB for time-series market data
  timescaledb:
    image: timescale/timescaledb-ha:pg15-latest
    hostname: timescaledb
    container_name: infinityai-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: infinityai
      POSTGRES_PASSWORD: infinityai_secure_pass
    volumes:
      - timescaledb-data:/var/lib/postgresql/data

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    container_name: infinityai-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    container_name: infinityai-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: infinityai_admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    hostname: jaeger
    container_name: infinityai-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
    environment:
      COLLECTOR_OTLP_ENABLED: true

  # NGINX as reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    hostname: nginx
    container_name: infinityai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - engine-a
      - engine-b
      - engine-c

  # Engine A - Market Data Ingestion Service
  engine-a:
    build:
      context: .
      dockerfile: engines/engine-a/Dockerfile
    hostname: engine-a
    container_name: infinityai-engine-a
    ports:
      - "8001:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://infinityai:infinityai_secure_pass@postgres:5432/infinityai
      - TIMESCALE_URL=postgresql://infinityai:infinityai_secure_pass@timescaledb:5432/market_data
      - ENGINE_NAME=ENGINE_A
      - LOG_LEVEL=INFO
    depends_on:
      - kafka
      - redis
      - postgres
      - timescaledb
    volumes:
      - ./engines/engine-a:/app
    restart: unless-stopped

  # Engine B - AI Signal Processing Service
  engine-b:
    build:
      context: .
      dockerfile: engines/engine-b/Dockerfile
    hostname: engine-b
    container_name: infinityai-engine-b
    ports:
      - "8002:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql://infinityai:infinityai_secure_pass@postgres:5432/infinityai
      - ENGINE_NAME=ENGINE_B
      - LOG_LEVEL=INFO
      # GPU configuration
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    depends_on:
      - kafka
      - redis
      - postgres
    volumes:
      - ./engines/engine-b:/app
      - /tmp/model_cache:/tmp/model_cache
    restart: unless-stopped
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Engine C - Trade Execution Service
  engine-c:
    build:
      context: .
      dockerfile: engines/engine-c/Dockerfile
    hostname: engine-c
    container_name: infinityai-engine-c
    ports:
      - "8003:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_URL=redis://redis:6379/2
      - DATABASE_URL=postgresql://infinityai:infinityai_secure_pass@postgres:5432/infinityai
      - ENGINE_NAME=ENGINE_C
      - LOG_LEVEL=INFO
      - BROKER_TYPE=dhan
      - PAPER_TRADE=false
    depends_on:
      - kafka
      - redis
      - postgres
    volumes:
      - ./engines/engine-c:/app
    restart: unless-stopped

  # Main FastAPI Application (existing)
  infinityai-api:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: infinityai-api
    container_name: infinityai-api
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_URL=redis://redis:6379/3
      - DATABASE_URL=postgresql://infinityai:infinityai_secure_pass@postgres:5432/infinityai
    depends_on:
      - kafka
      - redis
      - postgres
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  redis-data:
  postgres-data:
  timescaledb-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: infinityai-network
    driver: bridge