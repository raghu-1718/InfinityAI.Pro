# =============================================================================
# InfinityAI.Pro - GPU-Accelerated Docker Compose Configuration
# High-Performance Trading Platform with NVIDIA GPU Support
# =============================================================================

version: '3.8'

services:
  # ==========================================================================
  # GPU-ACCELERATED AI ENGINES
  # ==========================================================================
  
  # Engine A - GPU-Accelerated Market Data Processing
  infinityai-engine-a-gpu:
    build:
      context: ./engines/engine-a
      dockerfile: Dockerfile.gpu
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        VERSION: ${VERSION:-2.0.0}
    image: infinityai/engine-a:gpu-${VERSION:-2.0.0}
    container_name: infinityai-engine-a-gpu
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "8001:8001"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - INFINITYAI_ENGINE=A
      - INFINITYAI_ENV=production
      - API_PORT=8001
      - DHAN_CLIENT_ID=${DHAN_CLIENT_ID}
      - DHAN_ACCESS_TOKEN=${DHAN_ACCESS_TOKEN}
      - REDIS_URL=redis://infinityai-redis:6379
      - POSTGRES_URL=postgresql://infinityai:${POSTGRES_PASSWORD}@infinityai-postgres:5432/infinityai
      - TIMESCALE_URL=postgresql://infinityai:${POSTGRES_PASSWORD}@infinityai-timescaledb:5432/timescale
    volumes:
      - ./engines/engine-a:/app
      - infinityai-gpu-cache:/app/models/cache
      - infinityai-market-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import torch; assert torch.cuda.is_available(); print('GPU OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Engine B - GPU-Accelerated AI Signal Processing
  infinityai-engine-b-gpu:
    build:
      context: ./engines/engine-b
      dockerfile: Dockerfile.gpu.enhanced
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        VERSION: ${VERSION:-2.0.0}
    image: infinityai/engine-b:gpu-enhanced-${VERSION:-2.0.0}
    container_name: infinityai-engine-b-gpu
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "8002:8002"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - INFINITYAI_ENGINE=B
      - INFINITYAI_ENV=production
      - API_PORT=8002
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:1024
      - TORCH_CUDNN_BENCHMARK=1
      - REDIS_URL=redis://infinityai-redis:6379
      - POSTGRES_URL=postgresql://infinityai:${POSTGRES_PASSWORD}@infinityai-postgres:5432/infinityai
    volumes:
      - ./engines/engine-b:/app
      - infinityai-gpu-models:/app/models
      - infinityai-ai-cache:/app/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
          cpus: '6.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import torch, cupy, xgboost; print('AI GPU OK')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    depends_on:
      - infinityai-redis
      - infinityai-postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Engine C - Trade Execution (CPU optimized)
  infinityai-engine-c:
    build:
      context: ./engines/engine-c
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        VERSION: ${VERSION:-2.0.0}
    image: infinityai/engine-c:${VERSION:-2.0.0}
    container_name: infinityai-engine-c
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "8003:8003"
    environment:
      - INFINITYAI_ENGINE=C
      - INFINITYAI_ENV=production
      - API_PORT=8003
      - DHAN_CLIENT_ID=${DHAN_CLIENT_ID}
      - DHAN_ACCESS_TOKEN=${DHAN_ACCESS_TOKEN}
      - REDIS_URL=redis://infinityai-redis:6379
      - POSTGRES_URL=postgresql://infinityai:${POSTGRES_PASSWORD}@infinityai-postgres:5432/infinityai
    volumes:
      - ./engines/engine-c:/app
      - infinityai-trade-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - infinityai-redis
      - infinityai-postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # INFRASTRUCTURE SERVICES
  # ==========================================================================
  
  # Main API Gateway
  infinityai-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        VERSION: ${VERSION:-2.0.0}
    image: infinityai/api:${VERSION:-2.0.0}
    container_name: infinityai-api
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "8000:8000"
    environment:
      - INFINITYAI_ENV=production
      - ENGINE_A_URL=http://infinityai-engine-a-gpu:8001
      - ENGINE_B_URL=http://infinityai-engine-b-gpu:8002
      - ENGINE_C_URL=http://infinityai-engine-c:8003
      - REDIS_URL=redis://infinityai-redis:6379
      - POSTGRES_URL=postgresql://infinityai:${POSTGRES_PASSWORD}@infinityai-postgres:5432/infinityai
    volumes:
      - ./app:/app
    depends_on:
      - infinityai-engine-a-gpu
      - infinityai-engine-b-gpu
      - infinityai-engine-c
      - infinityai-redis
      - infinityai-postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # NGINX Load Balancer
  infinityai-nginx:
    image: nginx:alpine
    container_name: infinityai-nginx
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - infinityai-api
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================================
  # DATA SERVICES
  # ==========================================================================
  
  # PostgreSQL Primary Database
  infinityai-postgres:
    image: postgres:15-alpine
    container_name: infinityai-postgres
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=infinityai
      - POSTGRES_USER=infinityai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - infinityai-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinityai -d infinityai"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TimescaleDB for Time Series Data
  infinityai-timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: infinityai-timescaledb
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=timescale
      - POSTGRES_USER=infinityai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - infinityai-timescale-data:/var/lib/postgresql/data
      - ./database/timescale:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '3.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinityai -d timescale"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for Caching and Real-time Data
  infinityai-redis:
    image: redis:7-alpine
    container_name: infinityai-redis
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - infinityai-redis-data:/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================================
  # MONITORING AND OBSERVABILITY
  # ==========================================================================
  
  # Prometheus for Metrics Collection
  infinityai-prometheus:
    image: prom/prometheus:latest
    container_name: infinityai-prometheus
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - infinityai-prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Grafana for Visualization
  infinityai-grafana:
    image: grafana/grafana:latest
    container_name: infinityai-grafana
    restart: unless-stopped
    networks:
      - infinityai-network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - infinityai-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - infinityai-prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# =============================================================================
# NETWORKS AND VOLUMES
# =============================================================================

networks:
  infinityai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  # Database volumes
  infinityai-postgres-data:
    driver: local
  infinityai-timescale-data:
    driver: local
  infinityai-redis-data:
    driver: local
  
  # GPU-specific volumes
  infinityai-gpu-cache:
    driver: local
  infinityai-gpu-models:
    driver: local
  infinityai-ai-cache:
    driver: local
  
  # Application volumes
  infinityai-market-data:
    driver: local
  infinityai-trade-logs:
    driver: local
  
  # Monitoring volumes
  infinityai-prometheus-data:
    driver: local
  infinityai-grafana-data:
    driver: local