# Google Cloud Build configuration for Engine B with GPU support
# Builds and deploys to Cloud Run with GPU acceleration

steps:
  # Build the Docker image with GPU support
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-f', 'Dockerfile',
      '-t', 'gcr.io/$PROJECT_ID/infinityai-engine-b-gpu:latest',
      '-t', 'gcr.io/$PROJECT_ID/infinityai-engine-b-gpu:$BUILD_ID',
      '--build-arg', 'BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")',
      '--build-arg', 'GIT_COMMIT=$COMMIT_SHA',
      '--build-arg', 'VERSION=1.0.0',
      '.'
    ]
    timeout: 1800s

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/infinityai-engine-b-gpu:latest']

  # Deploy to Cloud Run with GPU
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'infinityai-engine-b-gpu',
      '--image', 'gcr.io/$PROJECT_ID/infinityai-engine-b-gpu:latest',
      '--platform', 'managed',
      '--region', 'us-central1',
      '--allow-unauthenticated',
      '--port', '8000',
      '--memory', '4Gi',
      '--cpu', '2',
      '--gpu', '1',
      '--gpu-type', 'nvidia-tesla-t4',
      '--max-instances', '10',
      '--min-instances', '1',
      '--concurrency', '100',
      '--timeout', '300',
      '--set-env-vars', 'USE_GPU=true,CUDA_VISIBLE_DEVICES=0,NVIDIA_VISIBLE_DEVICES=all',
      '--execution-environment', 'gen2'
    ]

# Build options
options:
  # Use high CPU machine for faster builds
  machineType: 'E2_HIGHCPU_8'
  
  # Increase disk size for CUDA base image
  diskSizeGb: 50
  
  # Use substitution variables
  substitution_option: 'ALLOW_LOOSE'

# Specify timeout for entire build
timeout: 2400s

# Substitutions for environment variables
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'infinityai-engine-b-gpu'