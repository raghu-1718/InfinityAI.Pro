# 🔥 InfinityAI.Pro Ultra Aggressive Trading - Google Cloud Run Service
# Production deployment configuration for ultra-aggressive trading system

steps:
  # Build the ultra-aggressive trading container
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'Dockerfile.ultra-aggressive',
      '-t', 'gcr.io/$PROJECT_ID/infinityai-ultra-aggressive:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/infinityai-ultra-aggressive:latest',
      '.'
    ]

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/infinityai-ultra-aggressive:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/infinityai-ultra-aggressive:latest']

  # Deploy to Cloud Run with ultra-aggressive configuration and REAL balance
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'infinityai-ultra-aggressive',
      '--image', 'gcr.io/$PROJECT_ID/infinityai-ultra-aggressive:$BUILD_ID',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '2Gi',
      '--cpu', '2',
      '--concurrency', '100',
      '--max-instances', '10',
      '--min-instances', '1',
      '--set-env-vars', 'ULTRA_AGGRESSIVE_MODE=true,ENVIRONMENT=production,CAPITAL_DOUBLING=true,NO_CONFIRMATIONS=true',
      '--set-env-vars', 'REAL_BALANCE=16083.22,TARGET_BALANCE=32166.44,LIVE_EXECUTION=true',
      '--set-env-vars', 'ENGINE_A_URL=https://infinityai-engine-a.agreeablemeadow-7375b1f7.eastus.azurecontainerapps.io',
      '--set-env-vars', 'ENGINE_B_URL=https://infinityai-engine-b-573866363639.us-central1.run.app',
      '--set-env-vars', 'DHAN_CLIENT_ID=1101302170,DHAN_API_KEY=a1196f5b',
      '--timeout', '900'
    ]

  # Deploy Engine A (Signal Analysis) 
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'backend/engines/engine-a/Dockerfile',
      '-t', 'gcr.io/$PROJECT_ID/infinityai-engine-a:$BUILD_ID',
      './backend/engines/engine-a'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/infinityai-engine-a:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'infinityai-engine-a',
      '--image', 'gcr.io/$PROJECT_ID/infinityai-engine-a:$BUILD_ID',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '1Gi',
      '--cpu', '1',
      '--max-instances', '5',
      '--min-instances', '1',
      '--set-env-vars', 'ENGINE_TYPE=signal_analysis,ULTRA_AGGRESSIVE_INTEGRATION=true'
    ]

  # Deploy Engine B (ML Processing)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'backend/engines/engine-b/Dockerfile', 
      '-t', 'gcr.io/$PROJECT_ID/infinityai-engine-b:$BUILD_ID',
      './backend/engines/engine-b'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/infinityai-engine-b:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'infinityai-engine-b',
      '--image', 'gcr.io/$PROJECT_ID/infinityai-engine-b:$BUILD_ID',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '2Gi',
      '--cpu', '2',
      '--max-instances', '5',
      '--min-instances', '1',
      '--set-env-vars', 'ENGINE_TYPE=ml_processing,GPU_ENABLED=false,ULTRA_AGGRESSIVE_INTEGRATION=true'
    ]

  # Update Engine C and D to integrate with ultra-aggressive system
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'services', 'update', 'infinityai-engine-c',
      '--region', 'us-east-1',
      '--update-env-vars', 'ULTRA_AGGRESSIVE_ENDPOINT=https://infinityai-ultra-aggressive-xyz.a.run.app,INTEGRATION_MODE=ultra_aggressive'
    ]

  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'services', 'update', 'infinityai-engine-d',
      '--region', 'us-east-1', 
      '--update-env-vars', 'ULTRA_AGGRESSIVE_ENDPOINT=https://infinityai-ultra-aggressive-xyz.a.run.app,INTEGRATION_MODE=ultra_aggressive'
    ]

# Service account permissions for ultra-aggressive trading
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'infinityai-ultra-aggressive'