apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infinityai-ingress
  namespace: infinityai
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-west-2:ACCOUNT_ID:certificate/CERT_ID"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/group.name: infinityai
    alb.ingress.kubernetes.io/group.order: '100'
  labels:
    app: infinityai
    component: ingress
spec:
  rules:
  - host: api.infinityai.pro
    http:
      paths:
      - path: /api/v1/data
        pathType: Prefix
        backend:
          service:
            name: engine-a-service
            port:
              number: 8001
      - path: /api/v1/ai
        pathType: Prefix
        backend:
          service:
            name: engine-b-service
            port:
              number: 8002
      - path: /api/v1/trading
        pathType: Prefix
        backend:
          service:
            name: engine-c-service
            port:
              number: 8003
      - path: /api/v1/chat
        pathType: Prefix
        backend:
          service:
            name: engine-d-service
            port:
              number: 8004
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: engine-c-service
            port:
              number: 8003
      - path: /
        pathType: Prefix
        backend:
          service:
            name: engine-c-service
            port:
              number: 8003
---
# Network Policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infinityai-network-policy
  namespace: infinityai
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - namespaceSelector:
        matchLabels:
          name: infinityai
    - podSelector: {}
  - from: []
    ports:
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8003
    - protocol: TCP
      port: 8004
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - namespaceSelector:
        matchLabels:
          name: infinityai
    - podSelector: {}
---
# Service Monitor for Prometheus (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: infinityai-engines
  namespace: infinityai
  labels:
    app: infinityai
    component: monitoring
spec:
  selector:
    matchLabels:
      app: engine-a
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
