apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-a
  namespace: infinityai
  labels:
    app: engine-a
    component: data-ingestion
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: engine-a
  template:
    metadata:
      labels:
        app: engine-a
        component: data-ingestion
        version: v1.0.0
    spec:
      serviceAccountName: infinityai-service-account
      containers:
      - name: engine-a
        image: infinityai/engine-a:latest
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: LOG_LEVEL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: REDIS_URL
        - name: YAHOO_FINANCE_API_KEY
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: YAHOO_FINANCE_API_KEY
        - name: ALPHA_VANTAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: ALPHA_VANTAGE_API_KEY
        - name: ENABLE_CACHE
          value: "true"
        - name: CACHE_TTL
          value: "300"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      nodeSelector:
        role: general
      tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "amd64"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: engine-a-service
  namespace: infinityai
  labels:
    app: engine-a
    component: data-ingestion
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: engine-a
---
apiVersion: v1
kind: Service
metadata:
  name: engine-a-headless
  namespace: infinityai
  labels:
    app: engine-a
    component: data-ingestion
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: engine-a
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: engine-a-pdb
  namespace: infinityai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: engine-a