# Engine C - Orchestrator & Trading Engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-c
  namespace: infinityai
  labels:
    app: engine-c
    component: orchestrator-trading
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: engine-c
  template:
    metadata:
      labels:
        app: engine-c
        component: orchestrator-trading
        version: v1.0.0
    spec:
      serviceAccountName: infinityai-service-account
      containers:
      - name: engine-c
        image: infinityai/engine-c:latest
        ports:
        - containerPort: 8003
          name: http
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: LOG_LEVEL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: REDIS_URL
        - name: ENGINE_A_URL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENGINE_A_URL
        - name: ENGINE_B_URL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENGINE_B_URL
        - name: ENGINE_D_URL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENGINE_D_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: DATABASE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: JWT_SECRET_KEY
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: ENCRYPTION_KEY
        - name: ALPACA_API_KEY
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: ALPACA_API_KEY
        - name: ALPACA_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: ALPACA_SECRET_KEY
        - name: ALPACA_BASE_URL
          value: "https://paper-api.alpaca.markets"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      nodeSelector:
        role: general
---
apiVersion: v1
kind: Service
metadata:
  name: engine-c-service
  namespace: infinityai
  labels:
    app: engine-c
    component: orchestrator-trading
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    protocol: TCP
    name: http
  selector:
    app: engine-c
---
# Engine D - AI Chatbot
