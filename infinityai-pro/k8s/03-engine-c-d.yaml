            path: /health
            port: 8004
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      nodeSelector:
        role: general
---
apiVersion: v1
kind: Service
metadata:
  name: engine-d-service
  namespace: infinityai
  labels:
    app: engine-d
    component: ai-chatbot
spec:
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    protocol: TCP
    name: http
  selector:
    app: engine-d
---
# Pod Disruption Budgets
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: engine-c-pdb
  namespace: infinityai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: engine-c
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: engine-d-pdb
  namespace: infinityai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: engine-d