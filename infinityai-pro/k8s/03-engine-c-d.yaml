    metadata:
      labels:
        app: engine-d
        component: ai-chatbot
        version: v1.0.0
    spec:
      serviceAccountName: infinityai-service-account
      containers:
      - name: engine-d
        image: infinityai/engine-d:latest
        ports:
        - containerPort: 8004
          name: http
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: LOG_LEVEL
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: REDIS_URL
        - name: ENGINE_A_URL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENGINE_A_URL
        - name: ENGINE_B_URL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENGINE_B_URL
        - name: ENGINE_C_URL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENGINE_C_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: DATABASE_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: OPENAI_API_KEY
