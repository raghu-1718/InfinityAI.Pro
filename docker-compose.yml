version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
    - 6379:6379
  engine-analytics:
    build:
      context: .
      dockerfile: backend/engine-analytics/src/Dockerfile
    ports:
    - 8100:8080
    environment:
    - PORT=8080
    - REDIS_URL=redis://redis:6379
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
  engine-core:
    build:
      context: .
      dockerfile: backend/engine-core/src/Dockerfile
    ports:
    - 8101:8080
    environment:
    - PORT=8080
    - REDIS_URL=redis://redis:6379
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
  engine-execution:
    build:
      context: .
      dockerfile: backend/engine-execution/src/Dockerfile
    ports:
    - 8102:8080
    environment:
    - PORT=8080
    - REDIS_URL=redis://redis:6379
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
