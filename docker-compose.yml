version: '3.8'

services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  engine-a:
    build:
      context: .
      dockerfile: backend/engines/engine-a/Dockerfile
    ports:
      - "8100:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  engine-b:
    build:
      context: .
      dockerfile: backend/engines/engine-b/Dockerfile
    ports:
      - "8101:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  engine-c:
    build:
      context: .
      dockerfile: backend/engines/engine-c-execution/Dockerfile
    ports:
      - "8102:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  engine-d:
    build:
      context: .
      dockerfile: backend/engines/engine-d/Dockerfile
    ports:
      - "8103:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - DHAN_CLIENT_ID=${DHAN_CLIENT_ID}
      - DHAN_ACCESS_TOKEN=${DHAN_ACCESS_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
