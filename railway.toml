# InfinityAI.Pro Railway Monorepo Configuration
# Each [service.*] block defines a separate Railway service in the same project.

# =====================================================
# Engine A — Orchestrator (FastAPI)
# =====================================================
[service.engine-a]
name = "engine-a"
rootDirectory = "backend/engine-a"
startCommand = "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"

[service.engine-a.build]
builder = "nixpacks"
nixpacksPlan = "requirements.txt"

[service.engine-a.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

