steps:
  # 1. Build Engine B Docker image
  - name: "gcr.io/cloud-builders/docker"
    id: "build-engine-b"
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-b:latest",
        "-f",
        "backend/engine-b/Dockerfile",
        ".",
      ]

  # 2. Push Engine B image to Artifact Registry (asia-south1)
  - name: "gcr.io/cloud-builders/docker"
    id: "push-engine-b"
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-b:latest",
      ]
    waitFor: ["build-engine-b"]

  # 3. Deploy to Cloud Run in asia-south1
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-engine-b"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "engine-b",
        "--image",
        "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-b:latest",
        "--set-env-vars",
        "GOOGLE_CLOUD_PROJECT=project-841b7f97-5ee3-4fbe-920,GCP_PROJECT_ID=project-841b7f97-5ee3-4fbe-920,GCS_MODELS_BUCKET=infinity-ai-models-vault,ENVIRONMENT=production",
        "--region",
        "asia-south1",
        "--platform",
        "managed",
        "--network",
        "default",
        "--subnet",
        "default",
        "--vpc-egress",
        "private-ranges-only",
        "--allow-unauthenticated",
        "--port",
        "8080",
        "--timeout",
        "600s",
        "--cpu",
        "4",
        "--memory",
        "16Gi",
      ]
    waitFor: ["push-engine-b"]

images:
  - "asia-south1-docker.pkg.dev/project-841b7f97-5ee3-4fbe-920/cloud-run-source-deploy/engine-b:latest"
timeout: "1800s"
