apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultra-aggressive
  namespace: infinityai
  labels:
    app: ultra-aggressive
    component: trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ultra-aggressive
  template:
    metadata:
      labels:
        app: ultra-aggressive
        component: trading
    spec:
      serviceAccountName: infinityai-service-account
      containers:
      - name: ultra-aggressive
        image: infinityai/ultra-aggressive:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: infinityai-config
              key: LOG_LEVEL
        - name: ULTRA_AGGRESSIVE_MODE
          value: "true"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: OPENAI_API_KEY
        - name: DHAN_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: DHAN_CLIENT_ID
        - name: DHAN_API_KEY
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: DHAN_API_KEY
        - name: DHAN_API_SECRET
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: DHAN_API_SECRET
        - name: DHAN_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: infinityai-secrets
              key: DHAN_ACCESS_TOKEN
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ultra-aggressive-service
  namespace: infinityai
  labels:
    app: ultra-aggressive
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: ultra-aggressive
