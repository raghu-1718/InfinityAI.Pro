apiVersion: v1
kind: Namespace
metadata:
  name: infinityai
  labels:
    name: infinityai
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infinityai-config
  namespace: infinityai
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  # Engine URLs (internal cluster DNS)
  ENGINE_A_URL: "http://engine-a-service:8001"
  ENGINE_B_URL: "http://engine-b-service:8002"
  ENGINE_C_URL: "http://engine-c-service:8003"
  ENGINE_D_URL: "http://engine-d-service:8004"
  # Kafka and Redis URLs
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  REDIS_URL: "redis://redis-service:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: infinityai-secrets
  namespace: infinityai
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: "postgresql://infinityai:CHANGE_THIS_PASSWORD@postgres-service:5432/infinityai"
  # JWT and encryption keys
  JWT_SECRET_KEY: "infinityai-super-secret-key-2024-production"
  ENCRYPTION_KEY: "your-encryption-key-32-chars-long"
  # API Keys (replace with real keys)
  ALPACA_API_KEY: "demo_key"
  ALPACA_SECRET_KEY: "demo_secret"
  OPENAI_API_KEY: "demo_key"
  YAHOO_FINANCE_API_KEY: "demo_key"
  ALPHA_VANTAGE_API_KEY: "demo_key"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infinityai-service-account
  namespace: infinityai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infinityai-cluster-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infinityai-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infinityai-cluster-role
subjects:
- kind: ServiceAccount
  name: infinityai-service-account
  namespace: infinityai