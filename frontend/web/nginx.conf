# Run nginx as a non-root user
user infinityai;
worker_processes auto;
error_log stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Write temp files to /tmp for non-root user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    
    sendfile        on;
    keepalive_timeout  65;
    
    access_log off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    server {
        listen 8080;
        server_name _;
        
        root /usr/share/nginx/html;
        index index.html;
        
        # API proxy to backend engines (GCP Cloud Run) - MUST BE BEFORE / location
        location /api/engine-a/ {
            proxy_pass https://engine-a-market-data-prod-573866363639.us-central1.run.app/;
            proxy_set_header Host engine-a-market-data-prod-573866363639.us-central1.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        location /api/engine-b/ {
            proxy_pass https://engine-b-ai-ml-prod-573866363639.us-central1.run.app/;
            proxy_set_header Host engine-b-ai-ml-prod-573866363639.us-central1.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        location /api/engine-c/ {
            proxy_pass https://engine-c-prod-573866363639.us-central1.run.app/;
            proxy_set_header Host engine-c-prod-573866363639.us-central1.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        location /api/engine-d/ {
            proxy_pass https://engine-d-chatbot-prod-573866363639.us-central1.run.app/;
            proxy_set_header Host engine-d-chatbot-prod-573866363639.us-central1.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        location /api/engine-ultra/ {
            proxy_pass https://engine-ultra-aggressive-prod-573866363639.us-central1.run.app/;
            proxy_set_header Host engine-ultra-aggressive-prod-573866363639.us-central1.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # Handle React Router (SPA) - MUST BE AFTER API locations
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    }
}