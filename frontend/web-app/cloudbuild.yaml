steps:
  # Step 1: Build Docker image from root context to include tsconfig.base.json
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-south1-docker.pkg.dev/galvanic-pulsar-482815-h0/infinityai/web-app:latest"
      - "-t"
      - "asia-south1-docker.pkg.dev/galvanic-pulsar-482815-h0/infinityai/web-app:${SHORT_SHA}"
      - "-f"
      - "frontend/web-app/Dockerfile"
      - "."
    id: "build-image"

  # Step 2: Push to Artifact Registry (latest)
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/galvanic-pulsar-482815-h0/infinityai/web-app:latest"
    id: "push-image-latest"
    waitFor: ["build-image"]

  # Step 2b: Push to Artifact Registry (SHA)
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/galvanic-pulsar-482815-h0/infinityai/web-app:${SHORT_SHA}"
    id: "push-image-sha"
    waitFor: ["build-image"]

  # Step 3: Deploy to Cloud Run with Ably Subscribe-Only Key
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "web-app"
      - "--image"
      - "asia-south1-docker.pkg.dev/galvanic-pulsar-482815-h0/infinityai/web-app:latest"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--timeout"
      - "3600"
      - "--allow-unauthenticated"
      - "--port"
      - "3000"
      - "--set-env-vars"
      - "NODE_ENV=production"
      - "--set-secrets"
      - "NEXT_PUBLIC_ABLY_API_KEY=ably-api-key-subscribe:latest"
      - "--project"
      - "galvanic-pulsar-482815-h0"
    id: "deploy-cloud-run"
    waitFor: ["push-image-latest"]

images:
  - "asia-south1-docker.pkg.dev/galvanic-pulsar-482815-h0/infinityai/web-app:latest"
  - "asia-south1-docker.pkg.dev/galvanic-pulsar-482815-h0/infinityai/web-app:${SHORT_SHA}"

timeout: "1800s"
options:
  machineType: "N1_HIGHCPU_8"
