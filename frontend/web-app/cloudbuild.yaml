steps:
  # Step 1: Install frontend dependencies
  - name: "node:20"
    id: "install-frontend-deps"
    entrypoint: "npm"
    args: ["--prefix", "frontend/web-app", "ci", "--legacy-peer-deps"]

  # Step 2: Build static export for Firebase Hosting (outputs frontend/web-app/out)
  - name: "node:20"
    id: "build-frontend-static"
    entrypoint: "npm"
    env:
      - "NODE_ENV=production"
      - "NEXT_PUBLIC_ENGINE_A_URL=https://engine-a-313407263327.asia-south1.run.app"
      - "NEXT_PUBLIC_ENGINE_B_URL=https://engine-a-313407263327.asia-south1.run.app"
      - "NEXT_PUBLIC_ENGINE_C_URL=https://engine-c-313407263327.asia-south1.run.app"
    args: ["--prefix", "frontend/web-app", "run", "build"]
    waitFor: ["install-frontend-deps"]

  # Step 3: Deploy Hosting to Firebase
  - name: "node:20"
    id: "deploy-firebase-hosting"
    entrypoint: "npx"
    args:
      [
        "-y",
        "firebase-tools@latest",
        "deploy",
        "--only",
        "hosting",
        "--project",
        "project-841b7f97-5ee3-4fbe-920",
      ]
    waitFor: ["build-frontend-static"]

timeout: "1800s"
